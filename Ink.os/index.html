  await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite'),os=tx.objectStore(store);os.clear();clean.forEach(row=>os.put(row));tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Не удалось обновить локальную базу.'));});
}
async function inkosApplySnapshot(snapshot){
  const source=snapshot&&snapshot.stores?snapshot.stores:(snapshot||{});inkosCloudPause++;
  try{for(const store of STORES){if(store==='settings'){let value=source.settings;if(Array.isArray(value))value=value[0];S.settings=value&&typeof value==='object'?{...value,id:'main'}:{id:'main',...defaultSettings()};await inkosReplaceStore('settings',[S.settings]);}
    else{S[store]=Array.isArray(source[store])?source[store].filter(x=>x&&typeof x==='object'):[];await inkosReplaceStore(store,S[store]);}}}
  finally{inkosCloudPause=Math.max(0,inkosCloudPause-1);}
}
function inkosReadLegacySnapshot(){
  return new Promise(async resolve=>{
    try{const fallback=localStorage.getItem('inkos_fallback_db');if(fallback){const old=JSON.parse(fallback),stores={};STORES.forEach(s=>stores[s]=s==='settings'?(old.settings||{id:'main',...defaultSettings()}):(Array.isArray(old[s])?old[s]:[]));const snap={schemaVersion:1,stores};if(inkosSnapshotHasRecords(snap)){resolve(snap);return;}}}catch(e){}
    let oldDb=null;try{
      if(indexedDB.databases){const names=await indexedDB.databases();if(!names.some(x=>x.name==='inkos_db')){resolve(null);return;}}
      oldDb=await new Promise(done=>{let newlyCreated=false;const req=indexedDB.open('inkos_db');req.onupgradeneeded=()=>{newlyCreated=true;try{req.transaction.abort();}catch(e){}};req.onsuccess=()=>{if(newlyCreated){try{req.result.close();}catch(e){}done(null);}else done(req.result);};req.onerror=()=>done(null);});
      if(!oldDb){resolve(null);return;}const stores={};
      for(const store of STORES){if(!oldDb.objectStoreNames.contains(store)){stores[store]=store==='settings'?{id:'main',...defaultSettings()}:[];continue;}
        const rows=await new Promise((done,reject)=>{const req=oldDb.transaction(store,'readonly').objectStore(store).getAll();req.onsuccess=()=>done(req.result||[]);req.onerror=()=>reject(req.error);});
        stores[store]=store==='settings'?(rows[0]||{id:'main',...defaultSettings()}):rows;}
      oldDb.close();const snap={schemaVersion:1,stores};resolve(inkosSnapshotHasRecords(snap)?snap:null);
    }catch(e){try{oldDb&&oldDb.close();}catch(x){}resolve(null);}
  });
}
function inkosRenderImportChoice(snapshot){
  inkosPendingLegacySnapshot=snapshot;const count=STORES.filter(s=>s!=='settings'&&Array.isArray((snapshot.stores||{})[s])).reduce((n,s)=>n+((snapshot.stores||{})[s]||[]).length,0);
  const gate=document.getElementById('inkosAuthGate');gate.classList.remove('hidden');
  gate.innerHTML='<div class="inkos-auth-card"><div class="inkos-auth-brand">INK<b>.OS</b></div><p class="inkos-auth-sub">Аккаунт '+esc(inkosCurrentUser?.email||'')+' готов к работе.</p>'+
    '<h2 style="font-size:19px;line-height:1.25;margin:0 0 8px">Что сделать со старыми данными?</h2>'+
    '<p style="font-size:12px;color:#b7aaa2;line-height:1.55;margin:0 0 14px">На устройстве найдены прежние данные INK.OS ('+count+' записей). Они пока не показаны новому аккаунту. Выбери, переносить ли их в этот профиль.</p>'+
    '<button class="inkos-auth-primary" id="inkosImportLegacyBtn" type="button">Перенести старые данные в мой аккаунт</button><button class="inkos-auth-secondary" id="inkosStartEmptyBtn" type="button">Начать с чистой базы</button>'+
    '<div class="inkos-auth-foot">Старые локальные данные не удаляются. Перенос копирует их в аккаунт; после переноса изменения синхронизируются с облаком.</div><div id="inkosAuthMessage" class="inkos-auth-message"></div></div>';
  document.getElementById('inkosImportLegacyBtn').onclick=()=>inkosChooseLegacyImport(true);document.getElementById('inkosStartEmptyBtn').onclick=()=>inkosChooseLegacyImport(false);
}
async function inkosChooseLegacyImport(importLegacy){
  const message=document.getElementById('inkosAuthMessage'),importBtn=document.getElementById('inkosImportLegacyBtn'),emptyBtn=document.getElementById('inkosStartEmptyBtn');[importBtn,emptyBtn].forEach(b=>{if(b)b.disabled=true;});
  if(message){message.textContent='Сохраняем личные данные аккаунта…';message.classList.add('show');}
  try{if(importLegacy&&inkosPendingLegacySnapshot)await inkosApplySnapshot(inkosPendingLegacySnapshot);else{inkosResetMemory();await inkosApplySnapshot({schemaVersion:1,stores:{settings:{id:'main',...defaultSettings()}}});}
    const ok=await inkosWriteCloudSnapshot(true);if(!ok)throw new Error('Облако не подтвердило сохранение. Проверь соединение и попробуй ещё раз.');inkosPendingLegacySnapshot=null;inkosStartApp();
  }catch(error){if(message){message.textContent=String(error.message||error);message.classList.add('show');}[importBtn,emptyBtn].forEach(b=>{if(b)b.disabled=false;});}
}
async function inkosStartUser(user){
  if(!user||!user.id)return;if(inkosActiveUserId===user.id&&appBooted)return;if(inkosStartPromise&&inkosStartingUserId===user.id)return inkosStartPromise;inkosStartingUserId=user.id;
  inkosStartPromise=(async()=>{
    inkosRenderAuth('loading','Проверяем права доступа и загружаем только данные этого аккаунта.');if(db){try{db.close();}catch(e){}db=null;}
    inkosCurrentUser=user;inkosActiveUserId=null;DB_NAME=inkosUserDbName(user.id);inkosResetMemory();await inkosInitLocalStore();
    let cloudRow=null;try{const {data,error}=await inkosSupabase.from('inkos_user_data').select('user_id,data,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;cloudRow=data;}
    catch(error){console.error('INK.OS account data load:',error);inkosRenderAuth('login','Не удалось проверить личную базу в облаке. Данные не открыты. Проверь интернет и войди ещё раз. Причина: '+String(error.message||error));throw error;}
    if(cloudRow){await inkosApplySnapshot(cloudRow.data||{schemaVersion:1,stores:{}});try{localStorage.setItem('inkos_cloud_synced_'+user.id,String(Date.parse(cloudRow.updated_at)||Date.now()));}catch(e){}}
    else if(inkosLocalDataExists()){const ok=await inkosWriteCloudSnapshot(false);if(!ok)throw new Error('В этой базе есть локальные изменения, но их не удалось сохранить в облако.');}
    else{const legacy=await inkosReadLegacySnapshot();if(legacy){inkosRenderImportChoice(legacy);return;}const ok=await inkosWriteCloudSnapshot(false);if(!ok)throw new Error('Не удалось создать личное облачное хранилище. Проверь интернет и попробуй ещё раз.');}
    inkosStartApp();
  })().catch(error=>{console.error('INK.OS account bootstrap:',error);if(!inkosPendingLegacySnapshot)inkosRenderAuth('login',String(error.message||error));}).finally(()=>{inkosStartPromise=null;inkosStartingUserId=null;});
  return inkosStartPromise;
}
function inkosStartApp(){
  inkosActiveUserId=inkosCurrentUser&&inkosCurrentUser.id;inkosPendingLegacySnapshot=null;const gate=document.getElementById('inkosAuthGate');gate.classList.add('hidden');gate.innerHTML='';inkosUpdateAccountButton();
  if(!appBooted){const splash=document.getElementById('splash');if(splash){splash.style.display='flex';splash.style.opacity='1';}finishSplash._done=false;runSplash();}
  else{document.getElementById('app').classList.remove('hidden');buildNav();go('dashboard');}
}
function inkosUpdateAccountButton(){const button=document.getElementById('accountBtn');if(!button)return;button.classList.toggle('hidden',!inkosCurrentUser);if(inkosCurrentUser){button.title=inkosCurrentUser.email||'Аккаунт';button.setAttribute('aria-label','Аккаунт: '+(inkosCurrentUser.email||''));}}

/* ====================== SAFE JSON BACKUP IMPORT ====================== */
function inkosPickBackupFile(){
  if(!inkosCurrentUser||!inkosSupabase){toast('Сначала войди в свой аккаунт INK.OS.');return;}
  closeSheet();
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.style.display='none';document.body.appendChild(input);
  input.onchange=async()=>{
    const file=input.files&&input.files[0];input.remove();if(!file)return;
    if(file.size>10*1024*1024){alert('Файл больше 10 МБ. Выбери JSON-файл резервной копии размером до 10 МБ.');return;}
    try{
      const parsed=JSON.parse(await file.text());
      const source=parsed&&parsed.stores&&typeof parsed.stores==='object'?parsed.stores:parsed;
      if(!source||typeof source!=='object'||Array.isArray(source)){alert('Не удалось распознать резервную копию INK.OS.');return;}
      const recognized=STORES.filter(store=>store==='settings'?(source.settings&&typeof source.settings==='object') : Array.isArray(source[store]));
      const hasRecords=STORES.some(store=>store!=='settings'&&Array.isArray(source[store])&&source[store].length>0);
      if(!recognized.length||!hasRecords){alert('В файле не найдены данные INK.OS. Выбери резервную копию JSON из приложения.');return;}
      const incomingCounts={};STORES.forEach(store=>{incomingCounts[store]=store==='settings'?0:(Array.isArray(source[store])?source[store].length:0);});
      const labelMap={clients:'Клиенты',events:'События календаря',payments:'Платежи',finance:'Финансовые операции',tattooWork:'Тату-работы',inventory:'Склад',cartridgeUsage:'Расход картриджей',notifications:'Уведомления',consents:'Согласия',auditLog:'Записи журнала'};
      const preview=Object.keys(labelMap).filter(store=>incomingCounts[store]>0).map(store=>labelMap[store]+': '+incomingCounts[store]).join('\n');
      const incomingTotal=STORES.reduce((sum,store)=>sum+(store==='settings'?0:incomingCounts[store]),0);
      if(!confirm('Найдена резервная копия INK.OS: '+file.name+'\n\n'+preview+'\nДругие разделы: '+Math.max(0,incomingTotal-Object.keys(labelMap).reduce((sum,store)=>sum+incomingCounts[store],0))+' записей.\n\nИмпорт объединит данные с текущими. Совпадающие ID обновятся из копии, остальные записи сохранятся. Продолжить?'))return;
      const mergedStores={};let added=0,updated=0;
      for(const store of STORES){
        if(store==='settings'){
          let val=source.settings;if(Array.isArray(val))val=val[0];
          mergedStores.settings=val&&typeof val==='object'?{...(S.settings||{}),...val,id:'main'}:{...(S.settings||{id:'main',...defaultSettings()}),id:'main'};
          continue;
        }
        const map=new Map();
        (Array.isArray(S[store])?S[store]:[]).filter(row=>row&&typeof row==='object').forEach(row=>{const clean={...row,id:row.id||uid()};map.set(String(clean.id),clean);});
        (Array.isArray(source[store])?source[store]:[]).filter(row=>row&&typeof row==='object').forEach(row=>{const clean={...row,id:row.id||uid()},key=String(clean.id);if(map.has(key))updated++;else added++;map.set(key,clean);});
        mergedStores[store]=Array.from(map.values());
      }
      const finalSnapshot={schemaVersion:1,stores:mergedStores};
      if(JSON.stringify(finalSnapshot).length>7*1024*1024){alert('После объединения резервная копия превышает лимит облачной синхронизации 7 МБ. Данные не изменены.');return;}
      await inkosApplySnapshot(finalSnapshot);
      inkosLocalRevision++;
      let synced=false;
      try{synced=await inkosWriteCloudSnapshot(true);}catch(e){console.error('INK.OS backup import sync:',e);}
      if(synced){
        toast('Импорт завершён: добавлено '+added+', обновлено '+updated+'. Облако синхронизировано.');
        inkosStartApp();
      }else{
        try{localStorage.setItem('inkos_cloud_dirty_'+inkosCurrentUser.id,String(Date.now()));}catch(e){}
        inkosQueueCloudSave();
        toast('Данные импортированы на устройство. Синхронизация с облаком повторится автоматически; пока не выходи из аккаунта.');
        inkosStartApp();
      }
    }catch(error){console.error('INK.OS backup import:',error);alert('Не удалось импортировать резервную копию: '+String(error.message||error));}
  };
  input.click();
}

function inkosAccountMenu(){if(!inkosCurrentUser)return;openSheet('Личный аккаунт','<div style="padding:8px 0 14px"><div class="small dim">Вы вошли как</div><div style="font-weight:800;overflow-wrap:anywhere">'+esc(inkosCurrentUser.email||'')+'</div><p class="small dim" style="margin-top:10px">Клиенты, записи, финансы и настройки синхронизируются только с этим аккаунтом.</p><button class="btn btn-block" style="margin-bottom:10px" type="button" onclick="inkosPickBackupFile()">Импортировать резервную копию JSON</button><button class="btn btn-danger btn-block" type="button" onclick="inkosDoSignOut()">Выйти из аккаунта</button></div>');}
async function inkosDoSignOut(){try{clearTimeout(inkosCloudTimer);await inkosWriteCloudSnapshot(false);const {error}=await inkosSupabase.auth.signOut();if(error)throw error;closeSheet();inkosHandleSignedOut();}catch(error){toast('Не удалось выйти: '+String(error.message||error));}}
function inkosHandleSignedOut(){
  inkosCurrentUser=null;inkosActiveUserId=null;inkosPendingLegacySnapshot=null;if(db){try{db.close();}catch(e){}db=null;}DB_NAME='inkos_db';inkosResetMemory();document.getElementById('app').classList.add('hidden');appBooted=false;
  const splash=document.getElementById('splash');if(splash){splash.style.display='flex';splash.style.opacity='1';}finishSplash._done=false;inkosUpdateAccountButton();inkosRenderAuth('login','Ты вышел из аккаунта. Для просмотра личных данных войди снова.');
}
async function inkosEnsureSupabaseSDK(){
  if(window.supabase&&typeof window.supabase.createClient==='function')return true;
  const sources=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'
  ];
  let lastError=null;
  for(const src of sources){
    try{
      await new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        let settled=false;
        const finish=err=>{
          if(settled)return;settled=true;clearTimeout(timer);
          script.onload=script.onerror=null;
          if(err){script.remove();reject(err);}else resolve();
        };
        const timer=setTimeout(()=>finish(new Error('Истекло время загрузки '+new URL(src).hostname)),12000);
        script.src=src;script.async=true;
        script.onload=()=>window.supabase&&typeof window.supabase.createClient==='function'?finish():finish(new Error('SDK загружен, но модуль не найден'));
        script.onerror=()=>finish(new Error('Не удалось загрузить '+new URL(src).hostname));
        document.head.appendChild(script);
      });
      if(window.supabase&&typeof window.supabase.createClient==='function')return true;
    }catch(error){lastError=error;console.warn('INK.OS: источник SDK недоступен',src,String(error));}
  }
  throw new Error('Не удалось загрузить модуль регистрации ни с одного источника. Проверь мобильный интернет и попробуй снова.'+(lastError?' ('+lastError.message+')':''));
}
async function inkosAuthInit(){
  inkosRenderAuth('loading','Подключаем вход. При необходимости проверим резервный источник загрузки.');
  try{
    await inkosEnsureSupabaseSDK();
    inkosSupabase=window.supabase.createClient(INKOS_SUPABASE_URL,INKOS_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    inkosSupabase.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{if(session&&session.user){if(inkosActiveUserId!==session.user.id)inkosStartUser(session.user).catch(()=>{});}else if(event==='SIGNED_OUT')inkosHandleSignedOut();},0);});
    const {data,error}=await inkosSupabase.auth.getSession();if(error)throw error;
    if(data&&data.session&&data.session.user)await inkosStartUser(data.session.user);else inkosRenderAuth('login');
  }catch(error){console.error('INK.OS auth init:',error);inkosRenderAuth('login','Не удалось подключить вход: '+String(error.message||error));}
}
window.addEventListener('online',()=>{if(inkosCurrentUser)inkosQueueCloudSave();});
window.addEventListener('beforeunload',()=>{if(inkosCurrentUser&&inkosCloudTimer)clearTimeout(inkosCloudTimer);});
inkosAuthInit();
