function openDaySummary(iso){
  const dayEvs=S.events.filter(e=>e.date===iso).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const counts={};
  dayEvs.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
  const hours=dayEvs.reduce((s,e)=>s+eventHours(e),0);
  const workStart=S.settings.workHoursStart||10, workEnd=S.settings.workHoursEnd||20;
  const busyRanges=dayEvs.filter(e=>e.start&&e.end).map(e=>[e.start,e.end]).sort();
  let freeWindows=[]; let cursor=String(workStart).padStart(2,'0')+':00';
  busyRanges.forEach(([s,e])=>{ if(s>cursor) freeWindows.push(cursor+'–'+s); cursor=e>cursor?e:cursor; });
  if(cursor<String(workEnd).padStart(2,'0')+':00') freeWindows.push(cursor+'–'+String(workEnd).padStart(2,'0')+':00');
  const revenue=S.finance.filter(f=>f.type==='income'&&f.date===iso).reduce((s,f)=>s+Number(f.amount||0),0);
  const filmSales=S.healingFilmSales.filter(f=>f.date===iso);
  const filmRevenue=filmSales.reduce((s,f)=>s+Number(f.amount||0),0);
  const typeOrder=['session','correction','consult','model','study','university','dayoff'];
  const typeBreakdown=typeOrder.map(k=>`<div class="kv"><span><span class="evt-dot" style="background:${EVENT_TYPES[k].color}"></span> ${EVENT_TYPES[k].label}</span><span style="${counts[k]?'':'color:var(--text-mute)'}">${counts[k]||0}</span></div>`).join('');
  const gsToday=guestSpotsOnDate(iso);
  const gsHtml=gsToday.length? `<div class="card" style="margin-bottom:10px;border-color:var(--pur);cursor:pointer" onclick="closeModal();openGuestSpotForm(${jattr(gsToday[0])})"><div class="row"><b>✈️ Guest Spot</b></div>${gsToday.map(g=>`<div class="small dim" style="margin-top:2px">${esc(g.city)}${g.place?(' — '+esc(g.place)):''} · ${fmtDate(g.dateStart)}–${fmtDate(g.dateEnd)}</div>`).join('')}</div>` : '';
  openModal(`<div class="modal-header"><h3>${fmtDate(iso)}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <p class="small dim" style="margin-bottom:2px">Нажмите на дату дважды, чтобы быстро добавить событие.</p>
  ${gsHtml}
  <div class="grid grid-2" style="margin-bottom:10px">
    <div class="stat"><div class="num">${dayEvs.length}</div><div class="lbl">Событий</div></div>
    <div class="stat"><div class="num">${fmtMoney(revenue)}</div><div class="lbl">Доход за день</div></div>
  </div>
  <div style="margin-bottom:10px">${typeBreakdown}</div>
  <div class="small dim" style="margin-bottom:10px">Часов занято: ${hours.toFixed(1)} · Свободные окна: ${freeWindows.join(', ')||'нет'}</div>
  <div class="card" style="margin-bottom:10px">
    <div class="row"><b>Заживляющая плёнка</b><span>${fmtMoney(filmRevenue)}</span></div>
    ${filmSales.length? filmSales.map(f=>`<div class="small dim" style="margin-top:4px">${f.qty} шт. · ${clientName(f.clientId)||'без клиента'} · ${f.method||''}</div>`).join('') : '<div class="small dim" style="margin-top:4px">Продаж плёнки в этот день не было.</div>'}
    <button class="btn btn-sm" style="margin-top:8px" onclick="closeModal();openFilmSaleForm('${iso}')">${icon('plus')} Добавить продажу плёнки</button>
  </div>
  ${dayEvs.map(e=>renderEventCard(e)).join('')}
  <button class="btn btn-block btn-primary" style="margin-top:10px" onclick="closeModal();openDayAdd('${iso}')">${icon('plus')} Добавить событие</button>`);
}
function openFilmSaleForm(iso){
  openModal(`<div class="modal-header"><h3>Продажа заживляющей плёнки</h3><button class="x" onclick="closeModal()">✕</button></div>
  <form id="filmSaleForm">
  <label>Клиент</label><select name="clientId"><option value="">— без клиента —</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <label>Дата</label><input type="date" name="date" value="${iso||todayISO()}">
  <div class="field-row">
    <div><label>Количество</label><input type="number" name="qty" value="1" min="1"></div>
    <div><label>Цена за шт.</label><input type="number" name="price" value=""></div>
  </div>
  <label>Способ оплаты</label><select name="method">${PAY_METHODS.map(m=>`<option>${m}</option>`).join('')}</select>
  <label>Комментарий</label><input name="comment">
  <div class="row" style="margin-top:14px"><span></span><button class="btn btn-primary" type="submit">Сохранить</button></div>
  </form>`);
  $('#filmSaleForm').onsubmit=async e=>{
    e.preventDefault(); const fd=new FormData(e.target);
    const qty=Number(fd.get('qty')||1), price=Number(fd.get('price')||0), amount=qty*price;
    const sale={id:uid(),clientId:fd.get('clientId')||'',date:fd.get('date'),qty,price,amount,method:fd.get('method'),comment:fd.get('comment')};
    await idbPut('healingFilmSales',sale); S.healingFilmSales.push(sale);
    if(amount>0){
      const fin={id:uid(),type:'income',category:'film',amount,date:sale.date,comment:'Продажа заживляющей плёнки'+(sale.clientId?(' · '+clientName(sale.clientId)):'')};
      await idbPut('finance',fin); S.finance.push(fin);
    }
    // decrement inventory stock
    const item=S.inventory.find(i=>i.category==='material'&&i.name==='Заживляющая плёнка');
    if(item){ item.qty=Math.max(0,(item.qty||0)-qty); await idbPut('inventory',item); }
    closeModal(); toast('Продажа плёнки сохранена'); computeAutoNotifications();
    if(currentRoute==='calendar') RENDERERS.calendar();
  };
}

function findOverlappingEvents(date,start,end,excludeId){
  if(!date||!start||!end) return [];
  return S.events.filter(ev=>ev.id!==excludeId && ev.date===date && ev.status!=='cancelled' && ev.status!=='noshow' && ev.start && ev.end && (start<ev.end && end>ev.start));
}
async function finalizeEventSave(obj){
  await idbPut('events',obj);
  const idx=S.events.findIndex(x=>x.id===obj.id);
  if(idx>=0) S.events[idx]=obj; else S.events.push(obj);
  closeModal(); toast('Событие сохранено');
  if(currentRoute==='calendar') RENDERERS.calendar(); else go('calendar');
}
function deleteEvent(id){
  const ev=S.events.find(x=>x.id===id);
  const label=ev?((EVENT_TYPES[ev.type]?.label||'')+(ev.clientId?(' · '+clientName(ev.clientId)):'')):'';
  confirmDialog('Удалить событие?',()=>{
    trashDelete({store:'events',listKey:'events',id,message:'Событие удалено.',auditEntity:'Событие',auditLabel:label,onChange:()=>{ if(currentRoute==='calendar') RENDERERS.calendar(); }});
  });
}

function completeSession(eventId){
  const e=S.events.find(x=>x.id===eventId); if(!e) return;
  const prog=checklistProgress(e);
  if(prog.preDone<prog.preTotal){
    confirmDialog(`Чек-лист «до сеанса» заполнен не полностью (${prog.preDone}/${prog.preTotal}). Всё равно завершить сеанс?`, ()=>completeSessionForm(eventId));
    return;
  }
  completeSessionForm(eventId);
}

function findOrCreateInventoryItem(category,name,unit){
  let item=S.inventory.find(i=>i.category===category && i.name===name);
  return item;
}
function decrementInventoryCartridge(config,size,qty){
  const name=`Картридж ${config}${size?(' '+size):''}`;
  let item=S.inventory.find(i=>i.category==='cartridge' && i.config===config && (i.size||'')===(size||''));
  if(!item){
    item={id:uid(),category:'cartridge',config,size,name,qty:0,threshold:S.settings.thresholds.cartridge,unit:'шт.'};
  }
  item.qty=Math.max(0,(item.qty||0)-qty);
  item.usedTotal=(item.usedTotal||0)+qty;
  idbPut('inventory',item);
  const idx=S.inventory.findIndex(i=>i.id===item.id);
  if(idx>=0) S.inventory[idx]=item; else S.inventory.push(item);
}

/* ====================== FINANCE ====================== */
let financePeriod='month';
function financePlural(n,one,few,many){
  const n10=Math.abs(Number(n))%10, n100=Math.abs(Number(n))%100;
  const word=(n10===1&&n100!==11)?one:([2,3,4].includes(n10)&&![12,13,14].includes(n100))?few:many;
  return Number(n)+' '+word;
}
const INCOME_CATEGORIES={tattoo:'Татуировки',consult:'Консультации',correction:'Коррекции',training:'Менторство',film:'Продажа заживляющей плёнки'};
const EXPENSE_CATEGORIES={cartridges:'Картриджи',pigments:'Пигменты',transferPaper:'Трансферная бумага',oilFoam:'Масло/пенка',lidocaine:'Ледокаин',rent:'Аренда',travel:'Guest Spot / поездки',other:'Другое'};
function periodRangeISO(period,offset){
  offset=offset||0;
  const now=new Date();
  let start,end;
  if(period==='day'){ start=new Date(now); start.setDate(start.getDate()+offset); end=new Date(start); }
  else if(period==='week'){ start=new Date(now); start.setDate(now.getDate()-((now.getDay()+6)%7)+offset*7); end=new Date(start); end.setDate(start.getDate()+6); }
  else if(period==='month'){ start=new Date(now.getFullYear(),now.getMonth()+offset,1); end=new Date(now.getFullYear(),now.getMonth()+offset+1,0); }
  else if(period==='quarter'){ const qAbs=Math.floor(now.getMonth()/3)+offset; const y=now.getFullYear()+Math.floor(qAbs/4); const qq=((qAbs%4)+4)%4; start=new Date(y,qq*3,1); end=new Date(y,qq*3+3,0); }
  else if(period==='year'){ start=new Date(now.getFullYear()+offset,0,1); end=new Date(now.getFullYear()+offset,11,31); }
  else { start=new Date(2000,0,1); end=new Date(now); }
  return {start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10)};
}function pctChange(cur,prev){
  if(!prev) return cur>0?100:0;
  return Math.round((cur-prev)/prev*100);
}
function trendHtml(pct){
  if(!isFinite(pct)) return '';
  const up=pct>=0;
  return `<span class="trend ${up?'up':'down'}">${up?'↗':'↘'} ${up?'+':''}${pct}%</span>`;
}
function buildIncomeSeries(startISO,endISO,granularity){
  const points=[]; let cur=new Date(startISO); const end=new Date(endISO);
  let guard=0;
  while(cur<=end && guard<400){
    guard++;
    let bucketEndDate;
    if(granularity==='day') bucketEndDate=new Date(cur);
    else if(granularity==='week'){ bucketEndDate=new Date(cur); bucketEndDate.setDate(bucketEndDate.getDate()+6); }
    else bucketEndDate=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    const bStart=cur.toISOString().slice(0,10);
    const bEnd=(bucketEndDate>end?end:bucketEndDate).toISOString().slice(0,10);
    const val=S.finance.filter(f=>f.type==='income'&&f.date>=bStart&&f.date<=bEnd).reduce((s,f)=>s+Number(f.amount||0),0);
    const label=granularity==='month'? cur.toLocaleDateString('ru-RU',{month:'short'}) : String(cur.getDate());
    points.push({label,value:val});
    if(granularity==='day') cur.setDate(cur.getDate()+1);
    else if(granularity==='week') cur.setDate(cur.getDate()+7);
    else cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return points;
}
RENDERERS.finance=function(){
  try {
  // Normalize records imported from older backups before reading finance analytics.
  S.finance=Array.isArray(S.finance)?S.finance.filter(f=>f&&typeof f==='object'):[];
  S.events=Array.isArray(S.events)?S.events.filter(e=>e&&typeof e==='object'):[];
  S.clients=Array.isArray(S.clients)?S.clients.filter(c=>c&&typeof c==='object'):[];
  S.payments=Array.isArray(S.payments)?S.payments.filter(p=>p&&typeof p==='object'):[];
  S.settings=S.settings&&typeof S.settings==='object'?S.settings:defaultSettings();
  const items=S.finance.filter(f=>financeScope(f));
  const income=items.filter(f=>f.type==='income').reduce((s,f)=>s+Number(f.amount||0),0);
  const expense=items.filter(f=>f.type==='expense').reduce((s,f)=>s+Number(f.amount||0),0);
  window._finItems=items;

  const {start,end}=periodRangeISO(financePeriod,0);
  const prevRange=periodRangeISO(financePeriod,-1);
  const periodEvts=S.events.filter(e=>e.date>=start&&e.date<=end);
  const prevEvts=S.events.filter(e=>e.date>=prevRange.start&&e.date<=prevRange.end);
  const recordsCount=periodEvts.length;
  const prevRecordsCount=prevEvts.length;
  const avgCheck=recordsCount? income/recordsCount : 0;

  const newClients=S.clients.filter(c=>c.firstVisit && c.firstVisit>=start && c.firstVisit<=end).length;
  const prevNewClients=S.clients.filter(c=>c.firstVisit && c.firstVisit>=prevRange.start && c.firstVisit<=prevRange.end).length;
  const repeatClientIds=new Set(periodEvts.filter(e=>{ const c=S.clients.find(x=>x.id===e.clientId); return c && (c.visits||0)>1; }).map(e=>e.clientId));
  const prevRepeatClientIds=new Set(prevEvts.filter(e=>{ const c=S.clients.find(x=>x.id===e.clientId); return c && (c.visits||0)>1; }).map(e=>e.clientId));
  const cancelled=periodEvts.filter(e=>e.status==='cancelled').length;
  const prevCancelled=prevEvts.filter(e=>e.status==='cancelled').length;
  const noshow=periodEvts.filter(e=>e.status==='noshow').length;
  const prevNoshow=prevEvts.filter(e=>e.status==='noshow').length;
  const workHours=periodEvts.filter(e=>['session','consult','correction','model'].includes(e.type)).reduce((s,e)=>s+eventHours(e),0);
  const fcToday=todayISO();
  const fcList=financePeriod==='all'?[]:periodEvts.filter(e=>!['completed','cancelled','noshow'].includes(e.status)&&e.date>=fcToday&&Number(e.cost||0)>0).map(e=>{
    const paid=S.payments.filter(p=>p.eventId===e.id).reduce((a,p)=>a+Number(p.amount||0),0);
    return {e,rest:Math.max(0,Number(e.cost||0)-Number(e.bookingAmount||0)-paid)};
  }).filter(x=>x.rest>0).sort((a,b)=>(a.e.date+(a.e.start||'')).localeCompare(b.e.date+(b.e.start||'')));
  const fcExpected=fcList.reduce((s,x)=>s+x.rest,0);
  window._finForecast=fcList;
  const fcLabel={day:'сегодня',week:'до конца недели',month:'до конца месяца',quarter:'до конца квартала',year:'до конца года'}[financePeriod]||'';

  const granularity = financePeriod==='year' ? 'month' : financePeriod==='quarter' ? 'week' : 'day';
  const seriesRange = financePeriod==='all' ? periodRangeISO('year',0) : {start,end};
  const chartPoints=buildIncomeSeries(seriesRange.start,seriesRange.end,granularity);

  $('#content').innerHTML=`
  <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <span></span>
    <button class="btn btn-primary btn-icon btn-sm" onclick="openFinanceForm()">${icon('plus')}</button>
  </div>
  <div class="fin-pair">
    <div class="fin-card inc">${icon('coin')}<div class="fl">Доход</div><div class="fv">${finVal(fmtMoney(income))}</div></div>
    <div class="fin-card exp">${icon('reports')}<div class="fl">Расходы</div><div class="fv">${finVal(fmtMoney(expense))}</div></div>
  </div>
  ${financePeriod!=='all'?`<div class="fin-forecast" onclick="openForecastSheet()">
    <div><div class="fl">Ещё заработаю ${fcLabel}</div><div class="fv">+${finVal(fmtMoney(fcExpected))}</div><div class="small dim">${fcList.length?fcList.length+' '+financePlural(fcList.length,'запись','записи','записей')+' с неоплаченным остатком':'Нет предстоящих записей с остатком'}</div></div>
    <div class="tot"><div class="fl">Итого за период</div><div class="fv">${finVal(fmtMoney(income+fcExpected))}</div><div class="small dim">с учётом прогноза</div></div>
  </div>`:''}
  <div class="segmented" style="margin-bottom:14px">${['day','week','month','quarter','year','all'].map(p=>`<button class="${financePeriod===p?'active':''}" onclick="setFinPeriod('${p}')">${{day:'День',week:'Неделя',month:'Месяц',quarter:'Квартал',year:'Год',all:'Всё'}[p]}</button>`).join('')}</div>
  <div class="card" style="margin-bottom:14px">
    <div class="sec-label" style="margin:0">Прибыль</div><div class="profit">${finVal(fmtMoney(income-expense))}</div><div class="small dim" style="margin-bottom:4px">График: доход, ${(S.settings.currency||'₽')}</div>
    ${S.settings.hideFinance? '<p class="dim small" style="padding:40px 0;text-align:center">График скрыт (Настройки → Безопасность)</p>' : '<canvas id="finMainChart" style="width:100%;height:170px"></canvas>'}
  </div>
  <div class="grid grid-2" style="margin-bottom:8px">
    <div class="analytics-card">
      <div class="ic-wrap">${icon('clientAdd')}</div>
      <div class="body"><div class="l">Новые клиенты</div><div class="n">${newClients} ${trendHtml(pctChange(newClients,prevNewClients))}</div></div>
    </div>
    <div class="analytics-card">
      <div class="ic-wrap">${icon('repeat')}</div>
      <div class="body"><div class="l">Повторные клиенты</div><div class="n">${repeatClientIds.size} ${trendHtml(pctChange(repeatClientIds.size,prevRepeatClientIds.size))}</div></div>
    </div>
    <div class="analytics-card">
      <div class="ic-wrap">${icon('close')}</div>
      <div class="body"><div class="l">Отмены</div><div class="n">${cancelled} ${trendHtml(pctChange(cancelled,prevCancelled))}</div></div>
    </div>
    <div class="analytics-card">
      <div class="ic-wrap">${icon('close')}</div>
      <div class="body"><div class="l">Неявки</div><div class="n">${noshow} ${trendHtml(pctChange(noshow,prevNoshow))}</div></div>
    </div>
    <div class="analytics-card">
      <div class="ic-wrap">${icon('clock')}</div>
      <div class="body"><div class="l">Часы работы</div><div class="n">${workHours.toFixed(1)}ч</div></div>
    </div>
  </div>
  <div class="tile-grid" style="margin:14px 0">
    <div class="tile" onclick="openFinCategories()">${icon('reports','ic')}<span>Категории</span></div>
    <div class="tile" onclick="openFinOperations()">${icon('data','ic')}<span>Операции (${items.length})</span></div>
    <div class="tile" onclick="openFinChart()">${icon('chart','ic')}<span>По категориям</span></div>
    <div class="tile" onclick="exportCSV('finance')">${icon('edit','ic')}<span>Экспорт</span></div>
  </div>
  <p class="small dim">* В доход не входят расходные материалы (картриджи, пигменты, бумага и т.д.) и зарплаты мастеров. Изменение % — по сравнению с предыдущим таким же периодом.</p>`;
  if(!S.settings.hideFinance) setTimeout(()=>drawLineChart($('#finMainChart'),chartPoints),20);
  } catch(err) {
    console.error('INK.OS: finance renderer failed',err);
    const root=$('#content');
    if(root) root.innerHTML=`<h2>Финансы</h2>
      <div class="card">
        <p>Не удалось полностью загрузить финансовую сводку.</p>
        <p class="small dim">Данные операций сохранены. Можно повторить загрузку или добавить операцию.</p>
        <p class="small dim" style="overflow-wrap:anywhere">Ошибка: ${esc(err&&err.message?err.message:String(err))}</p>
        <div class="btn-row">
          <button class="btn btn-sm" onclick="go('finance')">Повторить</button>
          <button class="btn btn-sm btn-primary" onclick="openFinanceForm()">Добавить операцию</button>
        </div>
      </div>`;
  }
};

function openFinOperations(){
  const items=(window._finItems||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));

function openFinChart(){
  const items=window._finItems||[];
  openSheet('По категориям дохода', `<canvas id="finChartCanvas" style="width:100%;height:200px"></canvas>`);
  const canvas=$('#finChartCanvas');
  const income=items.filter(f=>f.type==='income').reduce((s,f)=>s+Number(f.amount||0),0);
  const expense=items.filter(f=>f.type==='expense').reduce((s,f)=>s+Number(f.amount||0),0);
  const byIncomeCat={}; items.filter(f=>f.type==='income').forEach(f=>byIncomeCat[f.category]=(byIncomeCat[f.category]||0)+Number(f.amount||0));
  const catSeries=Object.entries(byIncomeCat).map(([k,v])=>({label:(INCOME_CATEGORIES[k]||k).slice(0,6),value:v,color:'#20B2AA'}));
  const series=[{label:'Доход',value:income,color:'#2ecc71'},{label:'Расход',value:expense,color:'#c62b28'},...catSeries];

function financeScope(f){
  if(!f || typeof f!=='object') return false;
  if(financePeriod==='all') return true;
  if(typeof f.date!=='string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(f.date)) return false;
  const range=periodRangeISO(financePeriod,0);
  return f.date>=range.start && f.date<=range.end;
}

  const list=window._finForecast||[];

function renderTrainBody(tab){

async function saveSkills(studentId){

function cartridgeKey(u){ return u.config+'|'+(u.size||''); }
function renderCartridgeAnalysis(){
  const now=Date.now();
  function usageSince(days){
    const cutoff=now-days*86400000;
    const agg={};
    S.cartridgeUsage.filter(u=>new Date(u.date).getTime()>=cutoff).forEach(u=>{ const k=cartridgeKey(u); agg[k]=(agg[k]||0)+Number(u.qty||0); });
    return agg;
  }
  const u30=usageSince(30), u90=usageSince(90), u365=usageSince(365);
  const top30=Object.entries(u30).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#invBody').innerHTML=`
  <div class="card">
    <h3>Самые часто используемые (30 дней)</h3>
    ${top30.length? '<ol>'+top30.map(([k,v])=>`<li>${k.replace('|',' ')} — ${v} шт.</li>`).join('')+'</ol>' : '<p class="dim">Недостаточно истории использования.</p>'}
  </div>
  <div class="grid grid-3" style="margin-top:10px">
    <div class="stat"><div class="num">${Object.values(u30).reduce((a,b)=>a+b,0)}</div><div class="lbl">30 дней</div></div>
    <div class="stat"><div class="num">${Object.values(u90).reduce((a,b)=>a+b,0)}</div><div class="lbl">90 дней</div></div>
    <div class="stat"><div class="num">${Object.values(u365).reduce((a,b)=>a+b,0)}</div><div class="lbl">Год</div></div>
  </div>
  <p class="small dim" style="margin-top:10px">Данные считаются по фактическим записям расхода картриджей после сеансов и Guest Spot — без AI, по локальной статистике.</p>`;
}
function renderPurchaseRecommendation(){
  const lead=Number(S.settings.leadTimeDays||7), reserve=Number(S.settings.reserve||3);
  const now=Date.now();
  const cutoff=now-30*86400000;
  const usage30={};
  S.cartridgeUsage.filter(u=>new Date(u.date).getTime()>=cutoff).forEach(u=>{ const k=cartridgeKey(u); usage30[k]=(usage30[k]||0)+Number(u.qty||0); });
  const cartridgeItems=invItemsByCat('cartridge');
  const rows=cartridgeItems.map(item=>{
    const k=cartridgeKey({config:item.config,size:item.size});
    const used30=usage30[k]||0;
    const hasHistory=used30>0;
    const avgDay=used30/30;
    const recommended = hasHistory ? Math.ceil(avgDay*lead+reserve) : null;
    const toBuy = hasHistory ? Math.max(0,recommended-item.qty) : null;
    const status = !hasHistory ? 'недостаточно истории' : (item.qty<=item.threshold?'докупить срочно':(toBuy>0?'докупить':'достаточно'));
    return {name:(item.config||'')+' '+(item.size||''),qty:item.qty,used30,avgDay,threshold:item.threshold,toBuy,status,hasHistory};
  });
  $('#invBody').innerHTML=`
  <div class="card">
    <h3>Рекомендация закупки картриджей</h3>
    <p class="small dim">Формула: рекомендуемый запас = средний расход в день × срок поставки (${lead} дн.) + резерв (${reserve} шт.). Если истории мало — используется минимальный остаток, и предлагается ввести количество вручную.</p>
    <div class="table-wrap"><table><tr><th>Конфигурация</th><th>Остаток</th><th>30 дн.</th><th>Средн./день</th><th>Мин.</th><th>Купить</th><th>Статус</th></tr>
    ${rows.length?rows.map(r=>`<tr style="${r.status.includes('срочно')?'background:rgba(198,43,40,.1)':''}">
      <td>${esc(r.name)}</td><td>${r.qty}</td><td>${r.used30}</td><td>${r.avgDay.toFixed(2)}</td><td>${r.threshold}</td>
      <td>${r.hasHistory? r.toBuy : '<span class="dim">вручную</span>'}</td><td>${r.status}</td></tr>`).join(''):'<tr><td colspan="7" class="dim">Нет картриджей на складе. Добавьте позиции в разделе «Картриджи».</td></tr>'}
    </table></div>
  </div>`;
}

/* --- Camera assistant --- */
function wireCameraRetry(){ $('#camStartBtn')?.click(); }
function wireCamera(){
  const startBtn=$('#camStartBtn');
  if(startBtn) startBtn.onclick=async ()=>{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast('Камера недоступна в этом браузере — выберите фото из галереи.');
      return;
    }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      photoState.cameraStream=stream;
      const v=$('#camVideo'); v.srcObject=stream; v.style.display='block'; $('#camPlaceholder').style.display='none';
      $('#camShotBtn').disabled=false;
      requestAnimationFrame(analyzeFrameLoop);
    }catch(e){
      let msg='Не удалось получить доступ к камере. Выберите фото из галереи.';
      let steps='';
      if(e && e.name==='NotAllowedError'){
        msg='Доступ к камере запрещён';
        steps=`<div style="text-align:left;margin-top:10px" class="small dim">
          <b style="color:var(--text)">Как разрешить:</b><br>
          • В адресной строке нажмите на значок 🔒 / ⓘ рядом с адресом сайта.<br>
          • Найдите пункт «Камера» и выберите «Разрешить».<br>
          • Обновите страницу и нажмите «Включить камеру» ещё раз.<br>
          Если это не помогло — браузер мог запомнить прошлый отказ навсегда. Проще всего воспользоваться кнопкой «Выбрать из галереи» ниже — на телефоне она откроет системную камеру.
        </div>`;
      }
      else if(e && e.name==='NotFoundError') msg='Камера не найдена на этом устройстве.';
      else if(e && e.name==='NotReadableError') msg='Камера уже используется другим приложением. Закройте его и нажмите «Повторить».';
      $('#camPlaceholder').style.display='flex';
      $('#camPlaceholder').style.flexDirection='column';
      $('#camPlaceholder').innerHTML=`<b>⚠️ ${esc(msg)}</b>${steps}<button class="btn btn-sm" style="margin-top:10px" onclick="wireCameraRetry()">Повторить</button>`;
      toast(msg);
    }
  };
  $('#camShotBtn').onclick=()=>{
    const v=$('#camVideo'); const c=document.createElement('canvas'); c.width=v.videoWidth||720; c.height=v.videoHeight||960;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    stopCamera();
    loadImageToEditor(c.toDataURL('image/jpeg',0.92));
    $$('#photoTabs button')[1].click();
  };
  $('#galleryInput').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{ loadImageToEditor(ev.target.result); $$('#photoTabs button')[1].click(); };
    reader.readAsDataURL(f);
  };
}
function stopCamera(){ if(photoState.cameraStream){ photoState.cameraStream.getTracks().forEach(t=>t.stop()); photoState.cameraStream=null; } }
function analyzeFrameLoop(){
  const v=$('#camVideo'); const ov=$('#camOverlay');
  if(!v || v.style.display==='none' || !photoState.cameraStream) return;
  ov.width=v.clientWidth; ov.height=v.clientHeight;
  const tmp=document.createElement('canvas'); tmp.width=80; tmp.height=100;
  const tctx=tmp.getContext('2d'); tctx.drawImage(v,0,0,80,100);
  let data; try{ data=tctx.getImageData(0,0,80,100).data; }catch(e){ return; }
  let sum=0,count=0,edgeSum=0;
  for(let i=0;i<data.length;i+=4){ const l=(data[i]+data[i+1]+data[i+2])/3; sum+=l; count++; }
  const avg=sum/count; // brightness 0-255
  // crude sharpness via variance of luminance diff between neighboring samples
  let variance=0,prev=null,n=0;
  for(let i=0;i<data.length;i+=16){ const l=(data[i]+data[i+1]+data[i+2])/3; if(prev!==null){ variance+=Math.abs(l-prev); n++; } prev=l; }
  const sharpness=n?variance/n:0;
  let score=100, hints=[];
  if(avg<60){ score-=30; hints.push('Слишком темно — измените свет'); }
  else if(avg>200){ score-=25; hints.push('Пересвет — уберите блик или уменьшите свет'); }
  if(sharpness<3){ score-=25; hints.push('Возможна дрожь камеры — держите ровно'); }
  if(hints.length===0){ hints.push('Кадр выглядит стабильным'); }
  score=Math.max(0,Math.min(100,score));
  const frameEl=$('#cameraFrame');
  frameEl.className='camera-frame '+(score>70?'good':score>40?'warn':'bad');
  $('#camScoreWrap').innerHTML=`<div>Оценка кадра: <b>${score}/100</b></div><div class="dim">${hints.join(' · ')}</div>`;
  requestAnimationFrame(analyzeFrameLoop);
}
/* --- Photo editor --- */
function handleEditFile(e){
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=ev=>loadImageToEditor(ev.target.result);
  reader.readAsDataURL(f);
}
function loadImageToEditor(dataUrl){
  const img=new Image();
  img.onload=()=>{
    photoState.file=dataUrl; photoState.img=img;
    photoState.adjust={brightness:1,contrast:1,saturation:1,redReduce:0,logo:true};
    if($('#editArea')) $('#editArea').classList.remove('hidden');
    renderEditCanvas();
  };
  img.src=dataUrl;
}
function resetEdit(){ if(photoState.img) loadImageToEditor(photoState.file); }
function applyPreset(key){
  const p=PHOTO_PRESETS[key];
  if($('#rBrightness')) $('#rBrightness').value=(p.brightness||1)*100;
  if($('#rContrast')) $('#rContrast').value=(p.contrast||1)*100;
  if($('#rSaturation')) $('#rSaturation').value=(p.saturation||1)*100;
  renderEditCanvas();
}
function renderEditCanvas(){
  if(!photoState.img) return;
  const canvas=$('#editCanvas'); const img=photoState.img;
  let w=img.width,h=img.height; const maxW=640; if(w>maxW){ h=h*maxW/w; w=maxW; }
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  const b=($('#rBrightness')?.value||100)/100, c=($('#rContrast')?.value||100)/100, s=($('#rSaturation')?.value||100)/100, r=($('#rRedReduce')?.value||0)/100;
  ctx.filter=`brightness(${b}) contrast(${c}) saturate(${s})`;
  ctx.drawImage(img,0,0,w,h);
  ctx.filter='none';
  if(r>0){
    const id=ctx.getImageData(0,0,w,h); const d=id.data;
    for(let i=0;i<d.length;i+=4){
      const avg=(d[i]+d[i+1]+d[i+2])/3;
      if(d[i]>d[i+1]+18 && d[i]>d[i+2]+18){ d[i]=d[i]-(d[i]-avg)*r; }
    }
    ctx.putImageData(id,0,0);
  }
  if($('#cLogo')?.checked && S.settings.logo){
    const logo=new Image();
    logo.onload=()=>{ const lw=w*0.22; const lh=logo.height*(lw/logo.width); ctx.globalAlpha=0.85; ctx.drawImage(logo,w-lw-10,h-lh-10,lw,lh); ctx.globalAlpha=1; };
    logo.src=S.settings.logo;
  }
}
async function savePhoto(){
  const canvas=$('#editCanvas'); if(!canvas){ toast('Нет фото для сохранения'); return; }
  const processedDataUrl=canvas.toDataURL('image/jpeg',0.9);
  const obj={id:uid(),clientId:photoState.clientId||'',dataUrl:photoState.file,processedDataUrl,history:['original','adjusted'],createdAt:Date.now(),tag:''};
  await idbPut('photos',obj); S.photos.push(obj);
  toast('Фото сохранено (оригинал + обработанная копия)');
}
function setPhotoTag(id,tag){
  const p=S.photos.find(x=>x.id===id); if(!p) return;

function openBeforeAfterSheet(){

  openSheet('Сравнение до/после', `
    <label>Клиент</label><select id="baClientSel">${clientOptions}</select>
    <div class="field-row">
      <div><label>Фото «до»</label><select id="baBeforeSel"></select></div>
      <div><label>Фото «после»</label><select id="baAfterSel"></select></div>
    </div>
    <div id="baViewer" style="margin-top:12px"></div>
  `);
  function photoList(){
    const cid=$('#baClientSel').value;
    return S.photos.filter(p=>!cid||p.clientId===cid);
  }
  function fillSelects(){
    const list=photoList();
    const label=p=>`${clientName(p.clientId)||'Без клиента'} · ${new Date(p.createdAt||0).toLocaleDateString('ru-RU')}${p.tag==='before'?' (до)':p.tag==='after'?' (после)':''}`;
    const opts=list.map(p=>`<option value="${p.id}">${esc(label(p))}</option>`).join('');
    $('#baBeforeSel').innerHTML=opts||'<option value="">—</option>';
    $('#baAfterSel').innerHTML=opts||'<option value="">—</option>';
    const beforeGuess=list.find(p=>p.tag==='before')||list[0];
    const afterGuess=list.find(p=>p.tag==='after')||list[list.length-1];
    if(beforeGuess) $('#baBeforeSel').value=beforeGuess.id;
    if(afterGuess) $('#baAfterSel').value=afterGuess.id;
    renderBA();
  }
  function renderBA(){
    const before=S.photos.find(p=>p.id===$('#baBeforeSel').value);
    const after=S.photos.find(p=>p.id===$('#baAfterSel').value);
    if(!before||!after){ $('#baViewer').innerHTML='<p class="dim small">Выберите два фото для сравнения.</p>'; return; }
    $('#baViewer').innerHTML=`
      <div id="baWrap" style="position:relative;width:100%;max-width:420px;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line-red);margin:0 auto;touch-action:pan-y">
        <img src="${after.processedDataUrl||after.dataUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
        <img id="baBeforeImg" src="${before.processedDataUrl||before.dataUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 50% 0 0)">
        <div id="baHandle" style="position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--red);box-shadow:0 0 8px var(--red-glow);pointer-events:none"></div>
        <div class="small" style="position:absolute;top:6px;left:8px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px;pointer-events:none">до</div>
        <div class="small" style="position:absolute;top:6px;right:8px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px;pointer-events:none">после</div>
      </div>
      <input type="range" id="baSlider" min="0" max="100" value="50" style="width:100%;max-width:420px;display:block;margin:10px auto 0">
    `;
    $('#baSlider').oninput=e=>{
      const pct=e.target.value;
      $('#baBeforeImg').style.clipPath='inset(0 '+(100-pct)+'% 0 0)';
      $('#baHandle').style.left=pct+'%';
    };
  }
  $('#baClientSel').onchange=fillSelects;
  $('#baBeforeSel').onchange=renderBA;
  $('#baAfterSel').onchange=renderBA;
  fillSelects();
}

    <button class="btn btn-primary btn-sm" onclick="generateWeeklyReport()">Сформировать отчёт за неделю</button>
  </div>
  <div id="reportOut"></div>`;

function generateWeeklyReport(){
  const now=new Date(); const start=new Date(now); start.setDate(now.getDate()-now.getDay()+1);
  const s=start.toISOString().slice(0,10);
  const weekEvents=S.events.filter(e=>e.date>=s);
  const sessions=weekEvents.filter(e=>e.type==='session').length;
  const consults=weekEvents.filter(e=>e.type==='consult').length;
  const corrections=weekEvents.filter(e=>e.type==='correction').length;
  const models=weekEvents.filter(e=>e.type==='model').length;
  const newClients=S.clients.filter(c=>c.firstVisit>=s).length;
  const revenue=S.finance.filter(f=>f.type==='income'&&f.date>=s).reduce((a,f)=>a+Number(f.amount||0),0);
  const expenses=S.finance.filter(f=>f.type==='expense'&&f.date>=s).reduce((a,f)=>a+Number(f.amount||0),0);
  const filmSales=S.healingFilmSales.filter(f=>f.date>=s).reduce((a,f)=>a+Number(f.amount||0),0);
  const text=`Отчёт за неделю от ${fmtDate(s)}\n\nСеансы: ${sessions}\nКонсультации: ${consults}\nКоррекции: ${corrections}\nМодели: ${models}\nНовые клиенты: ${newClients}\nВыручка: ${fmtMoney(revenue)}\nРасходы: ${fmtMoney(expenses)}\nПродажи плёнки: ${fmtMoney(filmSales)}\nЧистая прибыль (предварительно): ${fmtMoney(revenue-expenses)}`;
  const rev={id:uid(),date:todayISO(),weekStart:s,text};
  idbPut('reminders',rev);
  window._lastReportText=text;
  window._lastReportSeries=[
    {label:'Сеансы',value:sessions,color:'#20B2AA'},
    {label:'Консульт.',value:consults,color:'#F4C542'},
    {label:'Коррекции',value:corrections,color:'#E53935'},
    {label:'Модели',value:models,color:'#8E44AD'},
    {label:'Новые кл.',value:newClients,color:'#60A5FA'}
  ];
  $('#reportOut').innerHTML=`<div class="card" style="margin-bottom:10px"><canvas id="reportChartCanvas" style="width:100%;height:180px"></canvas></div>
  <div class="card"><pre style="white-space:pre-wrap;font-family:inherit">${esc(text)}</pre>
  <div class="row" style="margin-top:8px"><button class="btn btn-sm" onclick="copyLastReport()">Копировать</button></div></div>`;
  setTimeout(()=>drawBarChart($('#reportChartCanvas'),window._lastReportSeries),20);
}
function copyLastReport(){
  if(!window._lastReportText) return;
  navigator.clipboard?.writeText(window._lastReportText).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать'));
}

function exportFullBackup(){
  const payload={}; STORES.forEach(s=>payload[s]=S[s]);
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  downloadBlob(blob,`inkos_backup_${todayISO()}.json`);
  toast('Резервная копия скачана');
  const rec={id:uid(),date:todayISO(),note:'Полная резервная копия'};
  idbPut('backups',rec); S.backups.push(rec);
}
function exportSelective(){
  openModal(`<div class="modal-header"><h3>Выборочный экспорт</h3><button class="x" onclick="closeModal()">✕</button></div>
  ${STORES.filter(s=>s!=='settings').map(s=>`<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-weight:400"><input type="checkbox" class="expChk" value="${s}"> ${s}</label>`).join('')}
  <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="doSelectiveExport()">Экспортировать выбранное</button>`);
}
function doSelectiveExport(){
  const chosen=$$('.expChk:checked').map(c=>c.value);
  const payload={}; chosen.forEach(s=>payload[s]=S[s]);
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  downloadBlob(blob,`inkos_export_${chosen.join('-')}_${todayISO()}.json`);
  closeModal(); toast('Экспортировано');
}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportCSV(store){
  const rows=S[store]||[];
  if(!rows.length){ toast('Нет данных для экспорта'); return; }
  const keys=Array.from(new Set(rows.flatMap(r=>Object.keys(r))));
  const csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>`"${String(r[k]==null?'':r[k]).replace(/"/g,'""')}"`).join(','))).join('\n');
  downloadBlob(new Blob([csv],{type:'text/csv'}),`${store}_${todayISO()}.csv`);
}
function startImport(mode){
  const f=$('#importFile').files[0];
  if(!f){ toast('Выберите файл для импорта'); return; }
  const reader=new FileReader();
  reader.onload=async ev=>{
    let json; try{ json=JSON.parse(ev.target.result); }catch(e){ toast('Файл повреждён или не JSON'); return; }
    const counts=Object.entries(json).map(([k,v])=>`${k}: ${Array.isArray(v)?v.length:1}`).join(', ');
    confirmDialog(`Найдено: ${counts}. Создать резервную копию перед импортом и продолжить (${mode==='replace'?'ЗАМЕНА':'объединение'})?`, async ()=>{
      exportFullBackup();
      for(const [store,items] of Object.entries(json)){
        if(!STORES.includes(store)) continue;
        if(store==='settings'){ S.settings={...S.settings,...items}; await saveSettings(); continue; }
        if(mode==='replace'){ S[store]=[]; }
        const arr=Array.isArray(items)?items:[items];
        for(const it of arr){
          const idx=S[store].findIndex(x=>x.id===it.id);
          if(idx>=0) S[store][idx]=it; else S[store].push(it);
          await idbPut(store,it);
        }
      }
      toast('Импорт завершён'); go('data');
    });
  };
  reader.readAsText(f);
}

const CALC_SIZES={'Маленькая (до 5 см)':1,'Средняя (5-15 см)':1.6,'Крупная (15-25 см)':2.4,'Очень крупная (25+ см)':3.4};
const CALC_COMPLEXITY={'Простая':1,'Средняя':1.3,'Сложная':1.7,'Очень сложная':2.2};
RENDERERS.calculator=function(){
  const cur=S.settings.calcCurrency||'₽';
  $('#content').innerHTML=`
  <h2>Калькулятор цены</h2>
  <div class="card">
    <form id="calcForm">
    <div class="field-row">
      <div><label>Почасовая ставка</label><input type="number" name="rate" value="${S.settings.calcRate||3000}"></div>
      <div><label>Валюта</label><select name="currency"><option ${cur==='₽'?'selected':''}>₽</option><option ${cur==='$'?'selected':''}>$</option><option ${cur==='€'?'selected':''}>€</option><option ${cur==='₸'?'selected':''}>₸</option></select></div>
    </div>
    <div class="field-row">
      <div><label>Минимальная стоимость</label><input type="number" name="minCost" value="1500"></div>
      <div><label>Часы (предположительно)</label><input type="number" name="hours" value="3" step="0.5"></div>
    </div>
    <label>Размер</label><select name="size">${Object.keys(CALC_SIZES).map(k=>`<option>${k}</option>`).join('')}</select>
    <label>Сложность</label><select name="complexity">${Object.keys(CALC_COMPLEXITY).map(k=>`<option>${k}</option>`).join('')}</select>
    <div class="field-row">
      <div><label>Цвет</label><select name="colorType"><option>Чёрно-белая</option><option>Цветная</option></select></div>
      <div><label>Количество сеансов</label><input type="number" name="sessions" value="1" min="1"></div>
    </div>
    <div class="field-row">
      <div><label>Выездная наценка</label><input type="number" name="travelFee" value="0"></div>
      <div><label>Скидка, %</label><input type="number" name="discount" value="0"></div>
    </div>
    <div class="field-row">
      <div><label>Стоимость расходников</label><input type="number" name="materialsCost" value="0"></div>
      <div><label>Предоплата</label><input type="number" name="prepay" value="0"></div>
    </div>
    </form>
  </div>
  <div class="card" style="margin-top:12px" id="calcOut"></div>
  <p class="small dim" style="margin-top:8px">Итоговую цену внизу можно поправить вручную — калькулятор запомнит вашу правку и не будет пересчитывать её, пока вы не измените параметры выше.</p>`;
  let manualTotal=null;
  function recalc(){
    const fd=new FormData($('#calcForm'));
    const rate=Number(fd.get('rate')||0), minCost=Number(fd.get('minCost')||0), hours=Number(fd.get('hours')||0);
    const sizeMult=CALC_SIZES[fd.get('size')]||1, complexMult=CALC_COMPLEXITY[fd.get('complexity')]||1;
    const colorMult=fd.get('colorType')==='Цветная'?1.25:1;
    const sessions=Math.max(1,Number(fd.get('sessions')||1));
    const travelFee=Number(fd.get('travelFee')||0), discountPct=Number(fd.get('discount')||0);
    const materialsCost=Number(fd.get('materialsCost')||0), prepay=Number(fd.get('prepay')||0);
    S.settings.calcRate=rate; S.settings.calcCurrency=fd.get('currency'); saveSettings();
    const curNow=fd.get('currency');
    const base=rate*hours;
    const withCoeffs=base*sizeMult*complexMult*colorMult;
    const discountAmt=withCoeffs*discountPct/100;
    let total=withCoeffs - discountAmt + travelFee + materialsCost;
    total=Math.max(minCost,total);
    const finalTotal = manualTotal!=null ? manualTotal : total;
    const remain=finalTotal-prepay;
    const perSession=finalTotal/sessions;
    $('#calcOut').innerHTML=`
    <div class="kv"><span>Базовая стоимость (ставка × часы)</span><span>${base.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv"><span>С коэффициентами (размер×сложность×цвет)</span><span>${withCoeffs.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv"><span>Скидка</span><span>-${discountAmt.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv"><span>Выездная наценка</span><span>+${travelFee.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv"><span>Стоимость расходников</span><span>+${materialsCost.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv" style="border-top:1px solid var(--line-red);margin-top:6px;padding-top:10px">
      <span><b>Итоговая стоимость</b></span>
      <span><input type="number" id="calcManualTotal" value="${finalTotal.toFixed(0)}" style="width:120px;display:inline-block;text-align:right;color:var(--red-soft);font-weight:800"> ${curNow}</span>
    </div>
    <div class="kv"><span>Предоплата</span><span>${prepay.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv"><span>Остаток</span><span style="color:var(--red-soft);font-weight:700">${remain.toLocaleString('ru-RU')} ${curNow}</span></div>
    <div class="kv"><span>Стоимость одного сеанса (из ${sessions})</span><span>${perSession.toLocaleString('ru-RU')} ${curNow}</span></div>
    `;
    $('#calcManualTotal').oninput=e=>{ manualTotal=Number(e.target.value)||0; recalc(); };
  }
  $$('#calcForm input, #calcForm select').forEach(el=>el.addEventListener('input',()=>{ manualTotal=null; recalc(); }));
  recalc();
};

function disablePin(){ S.settings.pin=null; saveSettings(); toast('PIN отключён'); go('settings'); }
function wipeAllData(){
  confirmDialog('Удалить ВСЕ данные приложения безвозвратно? Рекомендуем сначала сделать резервную копию.',async()=>{
    for(const store of STORES){
      if(store==='settings') continue;
      const items=S[store]||[];
      for(const it of items) await idbDel(store,it.id);
      S[store]=[];
    }
    localStorage.removeItem('inkos_fallback_db');
    closeModal(); toast('Все данные удалены'); go('dashboard');
  });
}

/* ====================== PWA: manifest + service worker (best effort) ====================== */
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstallPrompt=e; if(currentRoute==='settings') go('settings'); });
function generateAppIcon(){
  try{
    const c=document.createElement('canvas'); c.width=512; c.height=512; const x=c.getContext('2d');
    x.fillStyle='#050506'; x.fillRect(0,0,512,512);
    x.strokeStyle='#ff2036'; x.shadowColor='#ff2036'; x.shadowBlur=18; x.lineWidth=5; x.beginPath(); x.moveTo(256,0); x.lineTo(256,96); x.stroke();
    x.textAlign='center'; x.textBaseline='middle'; x.shadowBlur=0; x.fillStyle='#fff'; x.font='900 170px Arial,sans-serif'; x.fillText('INK',256,215);
    x.shadowColor='#ff2036'; x.shadowBlur=30; x.fillStyle='#ff2036'; x.font='900 128px Arial,sans-serif'; x.fillText('.OS',256,350);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
(function setupManifest(){
  try{
    const iconUrl=generateAppIcon();
    const icons=iconUrl?[
      {src:iconUrl,sizes:'512x512',type:'image/png',purpose:'any'},
      {src:iconUrl,sizes:'512x512',type:'image/png',purpose:'maskable'}
    ]:[];
    const manifest={name:'INK.OS — Tattoo Business Assistant',short_name:'INK.OS',start_url:'.',id:'.',display:'standalone',background_color:'#050506',theme_color:'#050506',icons};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    document.getElementById('manifestLink').href=location.protocol.startsWith('http')?'manifest.webmanifest':URL.createObjectURL(blob);
    if(iconUrl){ ['appleIcon','favIcon'].forEach(id=>{ const l=document.getElementById(id); if(l) l.href=iconUrl; }); }
  }catch(e){}
})();
// Service worker (sw.js рядом с index.html) работает только при открытии по https.

/* ====================== ADAPTIVE: back button, keyboard, storage ====================== */
let _sentinel=false,_ignorePop=0,_popT=null;
function anyLayerOpen(){ return $('#modalOverlay').classList.contains('open')||$('#genericSheetOverlay').classList.contains('open')||$('#moreSheet').style.display==='flex'; }
function ensureSentinel(){ if(_sentinel) return; try{ history.pushState({ink:1},''); _sentinel=true; }catch(e){} }
function releaseSentinel(){ clearTimeout(_popT); _popT=setTimeout(()=>{ if(_sentinel&&!anyLayerOpen()){ _sentinel=false; _ignorePop++; try{ history.back(); }catch(e){ _ignorePop=0; } setTimeout(()=>{_ignorePop=0},700); } },40); }
function closeTopLayer(){
  if($('#genericSheetOverlay').classList.contains('open')) closeSheet();
  else if($('#moreSheet').style.display==='flex') closeMoreSheet();
  else if($('#modalOverlay').classList.contains('open')) closeModal();
}
(function(){
  const wrap=(name,after)=>{ const f=window[name]; window[name]=function(){ const r=f.apply(this,arguments); after(); return r; }; };
  ['openModal','openSheet','openMoreSheet'].forEach(n=>wrap(n,ensureSentinel));
  ['closeModal','closeSheet','closeMoreSheet'].forEach(n=>wrap(n,releaseSentinel));
})();
window.addEventListener('popstate',()=>{
  if(_ignorePop>0){ _ignorePop--; return; }
  if(!_sentinel) return;
  _sentinel=false; closeTopLayer();
  if(anyLayerOpen()) ensureSentinel();
});
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName||'').toLowerCase(), typing=['input','textarea','select'].includes(tag);
  if(e.key==='Escape'){ if(anyLayerOpen()){ e.preventDefault(); closeTopLayer(); } return; }
  if(e.altKey&&/^Digit[1-6]$/.test(e.code)){ e.preventDefault(); go(['dashboard','calendar','clients','projects','finance','inventory'][+e.code.slice(5)-1]); return; }
  if(typing||e.ctrlKey||e.metaKey||e.altKey||$('#splash').style.display!=='none'&&$('#splash').offsetParent!==null) return;
  if(e.key==='/'){ e.preventDefault(); if(typeof openGlobalSearch==='function') openGlobalSearch(); }
  else if(e.key==='n'||e.key==='т'){ e.preventDefault(); openEventForm(null,{type:'session'}); }
});
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ===== analytics: tabs, periods, deltas, area chart ===== */
let anPeriod='30', anTab='an';
const dpct=(a,b)=>b?Math.round((a-b)/b*100):(a?100:0);
const dlt=d=>`<span class="dlt ${d>=0?'up':'dn'}">${d>=0?'↑':'↓'} ${Math.abs(d)}%</span>`;
function anStats(f,t){
  const fin=(S.finance||[]).filter(x=>x.date>=f&&x.date<=t), sm=a=>a.reduce((n,x)=>n+Number(x.amount||0),0);
  const inc=sm(fin.filter(x=>x.type==='income')), exp=sm(fin.filter(x=>x.type!=='income'));
  const ev=S.events.filter(e=>e.status==='completed'&&e.date>=f&&e.date<=t);
  return {inc,exp,clients:new Set(ev.map(e=>e.clientId).filter(Boolean)).size,avg:ev.length?inc/ev.length:0,net:inc-exp-inc*Number(S.settings.taxRate||0)/100};
}
RENDERERS.analytics=function(){
  const days={'7':7,'30':30,'90':90,'365':365}[anPeriod], iso=d=>d.toISOString().slice(0,10), today=new Date();
  const shift=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const from=shift(today,-(days-1)), cur=anStats(iso(from),iso(today)), prev=anStats(iso(shift(from,-days)),iso(shift(from,-1)));
  const head=`<div class="chips" style="margin-top:0">${[['an','Аналитика'],['plan','Цель'],['tax','Налоги']].map(t=>`<button class="${anTab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  let body='';
  if(anTab==='an'){
    const n=days<=7?7:days>=365?12:6, size=days/n, vals=[], labs=[];
    for(let i=0;i<n;i++){ const a=iso(shift(from,Math.round(i*size))), b=iso(shift(from,Math.round((i+1)*size)-1)); vals.push((S.finance||[]).filter(x=>x.type==='income'&&x.date>=a&&x.date<=b).reduce((q,x)=>q+Number(x.amount||0),0)); labs.push(a.slice(8)+'.'+a.slice(5,7)); }
    const mx=Math.max(1,...vals), X=i=>10+i*320/(n-1), Y=v=>120-v/mx*100, pts=vals.map((v,i)=>[X(i),Y(v)]);
    const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    const chart=`<svg viewBox="0 0 340 150" style="width:100%"><defs><linearGradient id="anG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e11f2b" stop-opacity=".55"/><stop offset="1" stop-color="#e11f2b" stop-opacity="0"/></linearGradient></defs><path d="${line} L330 120 L10 120Z" fill="url(#anG)"/><path d="${line}" fill="none" stroke="#ff3d47" stroke-width="2"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#ff3d47"/>`).join('')}${labs.map((l,i)=>(n>7&&false)||i%(n>7?2:1)?'':`<text x="${X(i)}" y="141" font-size="9" fill="#777" text-anchor="middle">${l}</text>`).join('')}</svg>`;
    body=`<div class="chips">${[['7','7 дней'],['30','30 дней'],['90','90 дней'],['365','Год']].map(t=>`<button class="${anPeriod===t[0]?'on':''}" data-p="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="stat2"><div><small>Доход</small><b>${fmtMoney(cur.inc)}</b>${dlt(dpct(cur.inc,prev.inc))}</div><div><small>Клиенты</small><b>${cur.clients}</b>${dlt(dpct(cur.clients,prev.clients))}</div><div><small>Средний чек</small><b>${fmtMoney(Math.round(cur.avg))}</b>${dlt(dpct(cur.avg,prev.avg))}</div><div><small>Чистая прибыль</small><b>${fmtMoney(Math.round(cur.net))}</b>${dlt(dpct(cur.net,prev.net))}</div></div>
    <div class="cl-card"><div class="cl-lbl">Динамика дохода</div>${chart}</div>`;
  } else if(anTab==='plan'){
    body=planHtml();
  } else {
    const rate=Number(S.settings.taxRate||0), goal=Number(S.settings.monthGoal||0), ms=anStats(iso(new Date(today.getFullYear(),today.getMonth(),1)),iso(today)), pct=goal?Math.min(100,Math.round(ms.inc/goal*100)):0;
    body=`<div class="cl-card"><div class="cl-lbl">Налоги — текущий месяц</div><div class="an-big">${fmtMoney(ms.inc*rate/100)}</div><div class="small dim">отложить при ставке ${rate}% с дохода ${fmtMoney(ms.inc)}</div>
    ${goal?`<div class="cl-lbl" style="margin-top:12px">Цель ${fmtMoney(goal)} — ${pct}%</div><div class="pj-bar"><div style="width:${pct}%"></div></div>`:''}
    <div class="field-row" style="margin-top:12px"><div><label>Ставка налога, %</label><input type="number" id="anRate" min="0" max="100" step="0.5" value="${rate}"></div><div><label>Цель на месяц</label><input type="number" id="anGoal" min="0" value="${goal||''}"></div></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn btn-sm btn-primary" id="anSave">Сохранить</button><button class="btn btn-sm" onclick="exportAccountant('month')">CSV за месяц</button><button class="btn btn-sm" onclick="exportAccountant('year')">CSV за год</button></div></div>`;
  }
  $('#content').innerHTML=head+body;
  if(anTab==='plan') bindPlan();
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ anTab=b.dataset.tab; RENDERERS.analytics(); });
  $$('[data-p]').forEach(b=>b.onclick=()=>{ anPeriod=b.dataset.p; RENDERERS.analytics(); });
  if($('#anSave')) $('#anSave').onclick=async()=>{ S.settings.taxRate=Number($('#anRate').value||0); S.settings.monthGoal=Number($('#anGoal').value||0); await saveSettings(); toast('Сохранено'); RENDERERS.analytics(); };
};

  const inc=sm(fin.filter(f=>f.type==='income')), ex=fin.filter(f=>f.type!=='income'), exp=sm(ex), cat={};
  ex.forEach(f=>{ const k=f.category||'Прочее'; cat[k]=(cat[k]||0)+Number(f.amount||0); });

function renderTrainBody(tab){
  const body=$('#trainBody');
  if(tab==='students'){
    const stats=st=>{ const hw=S.homework.filter(h=>h.studentId===st.id), done=hw.filter(h=>h.status==='Принято').length; return {done,total:hw.length,pct:hw.length?Math.round(done/hw.length*100):0}; };
    const today=todayISO();
    const lessons=S.events.filter(e=>e.studentId&&e.date>=today&&e.status!=='cancelled').sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''))).slice(0,3);

    ${lessons.length?`<div class="mt-head"><h3>Ближайшие занятия</h3></div><div class="cl-card lessons">${lessons.map(e=>{ const st=S.students.find(x=>x.id===e.studentId); return `<div class="l" onclick="openEventView('${e.id}')"><span>${dayTxt(e.date)}</span><span>${e.start||''}</span><span>${esc(shortName(st&&st.name||''))}${e.title||e.zone?' — '+esc(e.title||e.zone):''}</span></div>`; }).join('')}</div>`:''}

function notifCfg(){ return Object.assign({h24:true,h2:true,dayOf:true,write:true,stock:true,restock:true,expenses:true,tips:true},S.settings.notif||{}); }
const isoL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function computeSmartNotifications(){
  const cfg=notifCfg(), nowD=new Date(), now=nowD.getTime(), hr=nowD.getHours(), today=isoL(nowD), tmr=isoL(new Date(now+86400000)), yst=isoL(new Date(now-86400000));

  S.events.filter(e=>e.date&&NOTIFY_TYPES.includes(e.type)&&!['cancelled','completed','noshow'].includes(e.status)).forEach(e=>{

    const tail=(who?' — '+who:'')+(e.zone?' ('+e.zone+')':''), key=`${e.id}-${e.date}-${e.start||''}`, ex={eventId:e.id,clientId:e.clientId||''};
    if(cfg.h2&&diff<=2*3600000) add(`Через 2 часа (${e.start||''}): ${tl}${tail}.`,'remind','r2-'+key,ex);
    else if(cfg.h24&&diff<=24*3600000&&(e.date===tmr||(e.date===today&&!cfg.dayOf))) add(`${e.date===tmr?'Завтра':'Сегодня'} в ${e.start||''}: ${tl}${tail}.${c?' Напомните клиенту и подтвердите время.':''}`,'remind','r24-'+key,ex);
    if(cfg.dayOf&&e.date===today&&(hr>=8||diff<=3*3600000)) add(`Сегодня в ${e.start||''}: ${tl}${tail}.`,'dayof','d-'+key,ex);
  });
  if(cfg.write){
    S.events.filter(e=>e.type==='session'&&e.status==='completed'&&e.clientId).forEach(e=>{ const c=S.clients.find(x=>x.id===e.clientId); if(!c) return;
      if(!e.careSent&&(e.date===today||e.date===yst)&&hr>=12) add(`Отправьте ${c.name} инструкцию по уходу за татуировкой.`,'care','care-'+e.id,{eventId:e.id,clientId:c.id});
      if(e.healCheck&&e.healCheck<=today) add(`Напишите ${c.name}: узнайте, как заживает татуировка, и попросите фото.`,'write','heal-'+e.id+'-'+e.healCheck,{clientId:c.id,eventId:e.id}); });
    const wait=S.clients.filter(c=>c.status==='Давно не был'||c.status==='Ожидает ответа');
    if(hr>=10&&wait.length) add(`Пора написать клиентам (${wait.length}): ${names(wait)}.`,'write','writew-'+Math.floor(now/(7*86400000)),{digest:true});
  }
  const low=S.inventory.filter(i=>i.category!=='equipment'&&Number(i.qty)<=Number(i.threshold)), nm=i=>i.name+(i.config?' ('+i.config+(i.size?' '+i.size:'')+')':'');
  if(cfg.stock){ const wk=Math.floor(now/(7*86400000)); low.forEach(i=>add(Number(i.qty)<=0?`Закончилось: ${nm(i)}. Пора заказать.`:`Заканчивается: ${nm(i)} — осталось ${i.qty} ${i.unit||'шт.'} (минимум ${i.threshold}).`,'stock',`lowstock-${i.id}-${i.qty}-${wk}`,{itemId:i.id})); }
  if(cfg.restock&&hr>=10&&low.length) add(`Пополнение склада: нужно закупить ${low.length} поз. — ${names(low.map(i=>({name:nm(i)})))}.`,'restock','restock-'+today);
  if(cfg.expenses&&hr>=19&&S.events.some(e=>e.date===today&&['session','consult','correction','model'].includes(e.type)&&e.status!=='cancelled')&&!(S.finance||[]).some(f=>f.type!=='income'&&f.date===today)) add('Не забудьте внести расходы за сегодня: материалы, аренда, транспорт.','expense','exp-'+today);
  if(cfg.tips&&hr>=12) add('💡 '+TIPS[Math.floor(now/86400000)%TIPS.length],'tip','tip-'+today);
}

function pushCfg(){ return Object.assign({enabled:false,server:'https://ntfy.sh',topic:'',names:false,sent:{}},S.settings.push||{}); }
function pushOn(){ const c=pushCfg(); return !!(c.enabled&&c.topic); }
async function savePush(c){ S.settings.push=c; await saveSettings(); }
function newTopic(){ const a=new Uint8Array(14); crypto.getRandomValues(a); return 'inkos-'+Array.from(a,b=>(b%36).toString(36)).join(''); }
function pushSafeText(kind,text){ return pushCfg().names||!['remind','dayof','write','care','followup','birthday'].includes(kind)?text:'Есть напоминание о клиенте — откройте INK.OS'; }
async function ntfyPublish(title,message,atSec){
  const c=pushCfg(), body={topic:c.topic,title,message,priority:4};

}
function pushCandidates(hz){

  const D=(date,h)=>new Date(date+'T'+String(h).padStart(2,'0')+':00').getTime();
  const days=Array.from({length:Math.min(32,Math.ceil(hz/86400000)+1)},(_,n)=>isoL(new Date(now+n*86400000)));
  S.events.filter(e=>e.date&&NOTIFY_TYPES.includes(e.type)&&!['cancelled','completed','noshow'].includes(e.status)).forEach(e=>{
    const start=new Date(e.date+'T'+(e.start||'10:00')).getTime(), c=e.clientId&&S.clients.find(x=>x.id===e.clientId), tl=EVENT_TYPES[e.type].label;
    const tail=((pc.names&&c)?' — '+c.name:(e.title&&!c?' — '+e.title:''))+(e.zone?' ('+e.zone+')':''), key=`${e.id}-${e.date}-${e.start||''}`;
    if(cfg.h2) put('r2-'+key,start-2*3600000,'Через 2 часа',`${e.start||''}: ${tl}${tail}`);
    if(cfg.h24) put('r24-'+key,start-24*3600000,'Завтра',`В ${e.start||''}: ${tl}${tail}. Напомните клиенту и подтвердите время.`);
    if(cfg.dayOf){ const sh=+(e.start||'10:00').slice(0,2); put('d-'+key,sh>=9?D(e.date,8):start-3600000,'Сегодня',`В ${e.start||''}: ${tl}${tail}`); }
  });
  const low=S.inventory.filter(i=>i.category!=='equipment'&&Number(i.qty)<=Number(i.threshold));
  if(cfg.restock&&low.length){ const t=low.slice(0,3).map(i=>i.name).join(', ')+(low.length>3?' и ещё '+(low.length-3):''); days.forEach(d=>put('restock-'+d,D(d,10),'Пополнение склада',`Нужно закупить ${low.length} поз.: ${t}.`)); }
  if(cfg.expenses) days.forEach(d=>{ if(S.events.some(e=>e.date===d&&['session','consult','correction','model'].includes(e.type)&&e.status!=='cancelled')&&!(S.finance||[]).some(f=>f.type!=='income'&&f.date===d)) put('exp-'+d,D(d,19),'Расходы','Не забудьте внести расходы за сегодня.'); });
  if(cfg.write) S.events.filter(e=>e.type==='session'&&e.status==='completed'&&e.clientId).forEach(e=>{ const c=S.clients.find(x=>x.id===e.clientId); if(!c) return; const who=pc.names?' '+c.name:' клиенту';
    if(!e.careSent){ const nx=isoL(new Date(new Date(e.date+'T12:00').getTime()+86400000)); put('care-'+e.id,[D(e.date,12),D(nx,12)].find(t=>t>now)||0,'Уход',`Отправьте${who} инструкцию по уходу.`); }

}
let _pushBusy=false;
async function syncPushSchedule(){

  try{
    const c=pushCfg(), sent=Object.assign({},c.sent), cut=Date.now()-6*86400000; Object.keys(sent).forEach(k=>{ if(sent[k]*1000<cut) delete sent[k]; });

  const required=(des>0||fixedSum>0)?Math.ceil((des+fixedSum)/(1-Math.min(tax,95)/100)):Number(S.settings.monthGoal||0);
  const from=isoL(new Date(now.getTime()-90*86400000)), ev=S.events.filter(e=>e.status==='completed'&&Number(e.cost)>0&&e.date>=from);
  const auto=ev.length?Math.round(ev.reduce((a,e)=>a+Number(e.cost),0)/ev.length):0, avg=Number(E.avg||0)||auto;
  const income=(S.finance||[]).filter(f=>f.type==='income'&&(f.date||'').startsWith(ym)).reduce((a,f)=>a+Number(f.amount||0),0);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), wdLeft=Math.max(1,Math.ceil((dim-now.getDate()+1)*E.days/7)), wdMonth=Math.max(1,Math.round(dim*E.days/7));
  const left=Math.max(0,required-income);
  return {E,tax,fixedSum,des,required,avg,auto,income,left,pct:required?Math.min(100,Math.round(income/required*100)):0,sessions:avg?Math.ceil(required/avg):0,sessionsLeft:avg?Math.ceil(left/avg):0,perDay:Math.ceil(required/wdMonth),perDayLeft:Math.ceil(left/wdLeft),perWeek:avg?Math.ceil(required/avg/(dim/7)):0};
}

/* ====================== INK.OS LOCAL AI ASSISTANT ======================
   No paid API and no client data is sent to an external model.
   Answers below are computed from CRM records and local templates.
*/
function aiAssistantLastVisit(client){
  if(client && client.lastVisit) return client.lastVisit;
  const today=todayISO();
  const completed=(S.events||[]).filter(e=>e.clientId===client.id && e.date && e.date<today && ['completed','done','finished','Завершён','Завершено'].includes(String(e.status||'')));
  if(completed.length) return completed.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0].date;
  if(Number(client.visits||0)===1 && client.firstVisit) return client.firstVisit;
  return '';
}
function aiAssistantMonth(text){
  const now=new Date();
  let year=now.getFullYear(), month=now.getMonth();
  const q=String(text||'').toLowerCase();
  const y=q.match(/\b(20\d{2})\b/);
  if(y) year=Number(y[1]);
  if(/прошл(?:ый|ого)?\s+месяц/.test(q)){
    month=now.getMonth()-1;
    if(month<0){month=11;year--;}
  }else{
    const names=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];
    for(let i=0;i<names.length;i++){if(q.includes(names[i])){month=i;if(!y&&month>now.getMonth())year--;break;}}
  }
  const d=new Date(year,month,1);
  return {key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),date:d,label:d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),days:new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
}
function aiAssistantCategoryLabel(key){
  if(!key) return 'Без категории';
  try{
    if(typeof INCOME_CATEGORIES!=='undefined'&&INCOME_CATEGORIES[key]) return INCOME_CATEGORIES[key];
    if(typeof EXPENSE_CATEGORIES!=='undefined'&&EXPENSE_CATEGORIES[key]) return EXPENSE_CATEGORIES[key];
  }catch(e){}
  return String(key);
}
function aiAssistantFinanceAnswer(text){
  const period=aiAssistantMonth(text);
  const items=(Array.isArray(S.finance)?S.finance:[]).filter(f=>f&&f.date&&String(f.date).slice(0,7)===period.key);
  const income=items.filter(f=>f.type==='income').reduce((sum,f)=>sum+Number(f.amount||0),0);
  const expense=items.filter(f=>f.type==='expense').reduce((sum,f)=>sum+Number(f.amount||0),0);
  const profit=income-expense;
  const expenseCats={};
  items.filter(f=>f.type==='expense').forEach(f=>{const k=aiAssistantCategoryLabel(f.category);expenseCats[k]=(expenseCats[k]||0)+Number(f.amount||0);});
  const biggest=Object.entries(expenseCats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let answer='Финансы за '+period.label+':\n\nДоход: '+fmtMoney(income)+'\nРасходы: '+fmtMoney(expense)+'\nЧистый результат: '+fmtMoney(profit)+'\nОпераций в журнале: '+items.length+'.';
  if(!items.length) answer='В финансовом журнале INK.OS за '+period.label+' пока нет операций. Поэтому я не буду придумывать сумму заработка. Добавь доходы и расходы в разделе «Финансы», и я рассчитаю результат.';
  if(biggest.length) answer+='\n\nКрупнейшие внесённые расходы:\n'+biggest.map(x=>'• '+x[0]+': '+fmtMoney(x[1])).join('\n');
  if(/прогноз|к концу месяца|ожидаем.*доход|сколько.*получится/.test(String(text).toLowerCase())){
    const now=new Date();
    if(period.key===todayISO().slice(0,7)){
      const day=Math.max(1,now.getDate());
      const predicted=Math.round(income/day*period.days);
      answer+='\n\nПростой прогноз выручки к концу месяца: около '+fmtMoney(predicted)+', если текущий темп сохранится. Это линейная оценка по уже внесённым доходам, не гарантия будущей выручки.';
    }else answer+='\n\nПрогноз по темпу не рассчитан: выбран не текущий месяц.';
  }
  return answer;
}
function aiAssistantSavingsAnswer(){
  const p=aiAssistantMonth('этот месяц');
  const items=(Array.isArray(S.finance)?S.finance:[]).filter(f=>f&&f.type==='expense'&&f.date&&String(f.date).slice(0,7)===p.key);
  if(!items.length) return 'За текущий месяц в журнале INK.OS пока нет записанных расходов. Добавь их в разделе «Финансы», чтобы я мог найти крупнейшие статьи экономии. Не буду советовать сокращать расходы на основании отсутствующих данных.';
  const groups={};
  items.forEach(f=>{const k=aiAssistantCategoryLabel(f.category);groups[k]=(groups[k]||0)+Number(f.amount||0);});
  const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const sum=items.reduce((n,f)=>n+Number(f.amount||0),0);
  return 'Посмотрел внесённые расходы за '+p.label+'. Всего: '+fmtMoney(sum)+'.\n\nСамые крупные статьи:\n'+top.map((x,i)=>(i+1)+'. '+x[0]+' — '+fmtMoney(x[1])).join('\n')+'\n\nЧто проверить:\n• Сравнить цены поставщиков по самым крупным категориям.\n• Отметить регулярные подписки и покупки, которые можно отложить.\n• Не урезать стерильные одноразовые материалы и безопасность ради экономии.\n\nЭто точки для проверки, а не утверждение, что расход лишний.';
}
function aiAssistantInactiveClients(){
  const today=todayISO();
  return (Array.isArray(S.clients)?S.clients:[]).map(c=>{
    const last=aiAssistantLastVisit(c);
    const days=last?daysBetween(last,today):null;
    return {client:c,last,days};
  }).filter(x=>x.days!==null?x.days>=60:x.client.status==='Давно не был')
    .sort((a,b)=>(b.days||9999)-(a.days||9999));
}
function aiAssistantInactiveAnswer(){
  const list=aiAssistantInactiveClients();
  if(!list.length) return 'Не нашёл клиентов с последним визитом 60 дней назад или раньше. Проверь, заполнены ли у карточек клиентов поля «Последний визит» и «Количество посещений».';
  const top=list.slice(0,12);
  return 'Клиенты, которым можно аккуратно напомнить о себе (60+ дней без визита): '+list.length+'.\n\n'+top.map((x,i)=>(i+1)+'. '+x.client.name+' — '+(x.days===null?'статус «Давно не был»':x.days+' дн. без визита'+(x.last?', последний: '+fmtDate(x.last):''))+'; посещений: '+Number(x.client.visits||0)+(x.client.totalSum?' ; сумма визитов: '+fmtMoney(x.client.totalSum):'')).join('\n')+'\n\nПример сообщения:\n«Привет, '+(top[0].client.name||'')+'! Давно не виделись 🖤 Как насчёт продолжить тату-проект или подобрать новую идею? Если актуально — напиши, обсудим эскиз и удобные даты».\n\nЯ только подготовил список и текст. Сообщения клиентам автоматически не отправлялись.';
}
function aiAssistantOutstanding(){
  const excluded=['cancelled','canceled','noshow','refunded','void','отменена','отменено'];
  return (Array.isArray(S.events)?S.events:[]).map(e=>{
    const status=String(e.status||'').toLowerCase();
    const cost=Number(e.cost||0);
    const ps=(Array.isArray(S.payments)?S.payments:[]).filter(p=>p&&p.eventId===e.id&&!['cancelled','canceled','refunded','void'].includes(String(p.status||'').toLowerCase()));
    const paidFromPayments=ps.reduce((n,p)=>n+Number(p.amount||0),0);
    const deposit=Number(e.bookingAmount||0);
    const paid=Math.max(deposit,paidFromPayments);
    return {event:e,cost,paid,left:Math.max(0,cost-paid),client:(S.clients||[]).find(c=>c.id===e.clientId)};
  }).filter(x=>x.cost>0 && x.left>0 && !excluded.includes(String(x.event.status||'').toLowerCase()) && ['session','correction','model'].includes(x.event.type))
    .sort((a,b)=>String(a.event.date||'').localeCompare(String(b.event.date||'')));
}
function aiAssistantOutstandingAnswer(){

function aiAssistantBuildContext(){

    payments:['date','createdAt','type','amount','sum','price','paid','paidAmount','status','paymentStatus','method','category','clientName','direction','currency'],
    finance:['date','createdAt','type','amount','sum','price','cost','status','method','category','title','name','direction','incomeType','expenseType','currency'],
    tattooWork:['name','title','date','status','style','styles','zone','zones','price','sum','paid','paidAmount','clientName','type'],
    photos:['title','name','date','createdAt','type','clientName','status'],
    students:['name','status','course','stage','date','createdAt','updatedAt'],
    homework:['title','name','status','deadline','priority','completed','date','createdAt'],
    inventory:['name','title','category','quantity','stock','cost','price','unitCost','salePrice','sku','updatedAt'],
    cartridgeUsage:['date','createdAt','name','type','quantity','count','cost','price'],
    healingFilmSales:['date','createdAt','name','quantity','count','amount','sum','price','cost'],
    guestSpots:['name','city','country','date','status','price','amount'],
    cities:['name','city','country','count'],
    reminders:['title','name','date','deadline','status','type','completed'],
    tasks:['title','name','date','deadline','status','type','priority','completed','done'],
    notifications:['kind','createdAt','read'],
    backups:['name','date','createdAt','status'],
    projects:['title','name','date','status','style','zones','clientName','price','sum','paid'],
    consents:['type','status','createdAt','date','clientName'],
    auditLog:['action','type','createdAt','date']
  };
  const stores={},counts={};
  for(const store of STORES){
    if(store==='settings')continue;
    const rows=Array.isArray(S[store])?S[store]:[];
    counts[store]=rows.length;
    const keys=fieldSets[store]||['name','title','date','status','type','amount','sum','price','category'];
    stores[store]=rows.slice(-60).map(row=>{
      const clean={};
      for(const key of keys){
        const value=row&&row[key];
        if(value===undefined||value===null||typeof value==='object')continue;
        const text=String(value);
        if(text.length>180)continue;
        clean[key]=value;
      }
      return clean;
    }).filter(row=>Object.keys(row).length);
  }
  const now=new Date();
  const context={currentDate:now.toISOString().slice(0,10),currency:(S.settings&&S.settings.currency)||'₽',
    workingHours:{start:S.settings&&S.settings.workHoursStart,end:S.settings&&S.settings.workHoursEnd},
    recordCounts:counts,stores};
  let serialized=JSON.stringify(context);
  while(serialized.length>24000){
    let changed=false;
    for(const name of Object.keys(stores)){
      if(stores[name].length>8){stores[name]=stores[name].slice(-Math.max(8,Math.floor(stores[name].length*0.7)));changed=true;}
    }
    if(!changed)break;
    serialized=JSON.stringify(context);
  }
  return context;
}

function aiAssistantBuildCloudContext(){
  const context=aiAssistantBuildContext();
  const stores=context&&context.stores||{};
  const nameMap=new Map();
  const clients=Array.isArray(stores.clients)?stores.clients:[];
  clients.forEach((row,index)=>{
    const original=String(row.name||'').trim();
    if(original)nameMap.set(original,'Клиент '+(index+1));
    row.name='Клиент '+(index+1);
    delete row.city;delete row.country;delete row.source;
    delete row.firstVisit;delete row.lastVisit;delete row.nextContact;
  });
  const removeKeys=/phone|email|telegram|whats|birth|allerg|address|personal.?note|contact/i;
  for(const list of Object.values(stores)){
    if(!Array.isArray(list))continue;
    for(const row of list){
      if(!row||typeof row!=='object')continue;
      for(const key of Object.keys(row)){
        if(removeKeys.test(key)){delete row[key];continue;}
        if(typeof row[key]==='string'){
          for(const [name,pseudo] of nameMap)if(name)row[key]=row[key].split(name).join(pseudo);
        }
      }
    }
  }
  if(Array.isArray(stores.auditLog))stores.auditLog=[];
  return context;
}
