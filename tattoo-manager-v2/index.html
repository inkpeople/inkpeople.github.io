<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10"><title>TATTOO MANAGER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--panel:#15151e;--panel2:#1b1a25;--muted:#9996a8;--line:#2b2937;--accent:#a855f7;--pink:#d946ef;--green:#4ade80;--yellow:#facc15;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#301344 0,transparent 36%),var(--bg);color:#f7f4fb;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 15px calc(88px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.13em;font-size:13px;color:#d8b4fe}.brand small{display:block;font-weight:500;letter-spacing:.04em;color:var(--muted);margin-top:3px}.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#9333ea,#c026d3);display:grid;place-items:center;font-weight:900}
h1{font-size:28px;letter-spacing:-.04em;margin:0 0 5px}.muted{color:var(--muted)}.eyebrow{color:#c084fc;text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:800}.headrow{display:flex;justify-content:space-between;align-items:end;margin:22px 0 14px}.date{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.stat,.panel,.tile{background:linear-gradient(145deg,#1b1a25,#12121a);border:1px solid var(--line);border-radius:17px}.stat{padding:15px}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:6px}.stat em{font-style:normal;font-size:11px;color:var(--green)}
.panel{padding:16px;margin:12px 0}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panelhead b{font-size:15px}.link{border:0;background:none;color:#d8b4fe;font-size:12px}.appointment{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.appointment:first-of-type{border-top:0}.time{font-weight:800;color:#d8b4fe;min-width:48px}.apptmain{flex:1}.apptmain b{display:block}.apptmain small{color:var(--muted)}.tag{font-size:10px;border-radius:20px;padding:4px 8px;background:#30213d;color:#e9d5ff;white-space:nowrap;height:max-content}.tag.green{background:#123322;color:#86efac}.tag.yellow{background:#392f13;color:#fde68a}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:15px;text-align:left;border-radius:15px;min-height:94px}.tile span{font-size:20px}.tile b{display:block;margin:9px 0 3px}.tile small{color:var(--muted)}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#101017ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 6px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#8f8b9d;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:48px}.nav button span{font-size:19px}.nav button.active{color:#d8b4fe}
.primary{border:0;border-radius:13px;padding:13px 16px;background:linear-gradient(100deg,#9333ea,#c026d3);font-weight:800;color:white}.secondary{border:1px solid var(--line);background:#201d2a;border-radius:12px;padding:11px 14px}.field{width:100%;background:#0e0e15;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;margin:6px 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.listitem{padding:13px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.listitem:first-child{border-top:0}.empty{padding:24px 10px;text-align:center;color:var(--muted)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:9px 2px;text-align:center;border:1px solid var(--line);border-radius:11px;color:var(--muted);font-size:11px}.day b{display:block;color:white;font-size:15px;margin-top:5px}.day.sel{background:#482166;border-color:#a855f7;color:#e9d5ff}.bar{height:7px;background:#292735;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9333ea,#d946ef);border-radius:10px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#292238;border:1px solid #6b3d8a;padding:10px 15px;border-radius:12px;display:none;z-index:10;font-size:13px;max-width:90%}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand">TATTOO MANAGER<small>ПАНЕЛЬ МАСТЕРА · DEMO</small></div><div class="avatar">R</div></header>
<main id="view"></main>
</div>
<nav class="nav" id="nav">
<button data-page="home" class="active"><span>⌂</span>Главная</button><button data-page="calendar"><span>▦</span>Календарь</button><button data-page="clients"><span>♙</span>Клиенты</button><button data-page="tools"><span>✦</span>Инструменты</button><button data-page="profile"><span>☷</span>Профиль</button>
</nav><div class="toast" id="toast"></div>
<script>
(()=>{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0b0b10');tg.setBackgroundColor('#0b0b10')}catch(e){}}
const $=s=>document.querySelector(s), view=$('#view');let page='home';
const today=new Date();const fmt=today.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'});
let bookings=JSON.parse(localStorage.getItem('tm_bookings')||'null')||[
{id:1,time:'10:00',name:'Анна Смирнова',work:'Цветочная композиция · предплечье',status:'Подтверждена'},
{id:2,time:'14:30',name:'Дмитрий Волков',work:'Продолжение рукава',status:'Ожидает подтверждения'},
{id:3,time:'18:00',name:'Мария К.',work:'Консультация · эскиз',status:'Подтверждена'}];
let clients=JSON.parse(localStorage.getItem('tm_clients')||'null')||[{name:'Анна Смирнова',phone:'+7 913 ••• •• 21',visits:3,last:'12 октября'},{name:'Дмитрий Волков',phone:'+7 923 ••• •• 48',visits:5,last:'28 сентября'},{name:'Мария К.',phone:'Контакт не указан',visits:1,last:'Новая заявка'}];
let stock=[{name:'Иглы / картриджи',qty:24,unit:'шт',min:10},{name:'Трансферная бумага',qty:8,unit:'листов',min:10},{name:'Защитная плёнка',qty:3,unit:'рулона',min:2},{name:'Самоклеящийся бинт',qty:12,unit:'шт',min:5}];
function save(){localStorage.setItem('tm_bookings',JSON.stringify(bookings));localStorage.setItem('tm_clients',JSON.stringify(clients))}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}
function heading(k,t,sub=''){return '<div class="eyebrow">'+k+'</div><div class="headrow"><div><h1>'+t+'</h1>'+(sub?'<div class="muted">'+sub+'</div>':'')+'</div></div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,calendar,clients:clientPage,tools,profile})[page]()}
function home(){view.innerHTML=heading('РАБОЧЕЕ ПРОСТРАНСТВО', 'Добрый день, мастер 👋',fmt)+
'<div class="stats"><div class="stat"><label>Записи сегодня</label><strong>'+bookings.length+'</strong><em>На этот день</em></div><div class="stat"><label>Клиенты</label><strong>'+clients.length+'</strong><em>В демо-базе</em></div><div class="stat"><label>Выручка месяца</label><strong>—</strong><em>Подключим учёт</em></div><div class="stat"><label>Задачи</label><strong>2</strong><em>Требуют внимания</em></div></div>'+
'<section class="panel"><div class="panelhead"><b>Ближайшие записи</b><button class="link" data-go="calendar">Весь календарь →</button></div>'+bookings.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(a=>'<div class="appointment"><div class="time">'+a.time+'</div><div class="apptmain"><b>'+a.name+'</b><small>'+a.work+'</small></div><span class="tag '+(a.status==='Подтверждена'?'green':'yellow')+'">'+a.status+'</span></div>').join('')+'</section>'+
'<div class="headrow"><b>Быстрые действия</b></div><div class="quick"><button class="tile" data-action="add"><span>＋</span><b>Новая запись</b><small>Добавить клиента</small></button><button class="tile" data-go="clients"><span>♙</span><b>Клиенты</b><small>Открыть базу</small></button><button class="tile" data-go="tools"><span>🧮</span><b>Калькулятор</b><small>Расчёт стоимости</small></button><button class="tile" data-go="tools"><span>📦</span><b>Склад</b><small>Остатки расходников</small></button></div>'}
function calendar(){view.innerHTML=heading('РАСПИСАНИЕ','Календарь','Планирование сеансов и консультаций')+'<div class="panel"><div class="panelhead"><b>'+today.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</b><span class="tag">Сегодня</span></div><div class="week">'+['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map((d,i)=>'<div class="day '+(i===((today.getDay()+6)%7)?'sel':'')+'">'+d+'<b>'+((today.getDate()-((today.getDay()+6)%7)+i+31)%31+1)+'</b></div>').join('')+'</div></div><section class="panel"><div class="panelhead"><b>Список записей</b><button class="primary" id="addBooking">＋ Добавить</button></div>'+(bookings.length?bookings.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(a=>'<div class="appointment"><div class="time">'+a.time+'</div><div class="apptmain"><b>'+a.name+'</b><small>'+a.work+'</small></div><span class="tag">'+a.status+'</span></div>').join(''):'<div class="empty">Записей пока нет</div>')+'</section><div class="muted" style="font-size:12px">Демо-календарь: даты и записи пока хранятся только на этом устройстве.</div>'}
function clientPage(){view.innerHTML=heading('КЛИЕНТСКАЯ БАЗА','Клиенты','Карточки и история взаимодействия')+'<input class="field" id="search" placeholder="Поиск по имени или телефону"><section class="panel"><div class="panelhead"><b>Все клиенты · '+clients.length+'</b><button class="primary" id="addClient">＋ Добавить</button></div><div id="clientList">'+clientRows(clients)+'</div></section>'}
function clientRows(arr){return arr.length?arr.map(c=>'<div class="listitem"><div><b>'+c.name+'</b><div class="muted" style="font-size:12px">'+c.phone+'</div><div class="muted" style="font-size:11px">Сеансов: '+c.visits+' · Последний визит: '+c.last+'</div></div><span>›</span></div>').join(''):'<div class="empty">Клиенты не найдены</div>'}
function tools(){view.innerHTML=heading('ИНСТРУМЕНТЫ','Рабочие инструменты','Дополнительные модули мастера')+'<div class="quick"><button class="tile" data-action="calc"><span>🧮</span><b>Калькулятор цены</b><small>Оценка проекта</small></button><button class="tile" data-action="stock"><span>📦</span><b>Склад</b><small>Остатки материалов</small></button><button class="tile" data-action="forms"><span>📝</span><b>Анкеты</b><small>Согласия и документы</small></button><button class="tile" data-action="ai"><span>✦</span><b>ИИ-помощник</b><small>Помощь мастеру</small></button></div><div id="toolDetail"></div>'}
function profile(){view.innerHTML=heading('АККАУНТ','Профиль мастера','Настройки рабочего пространства')+'<section class="panel"><div class="eyebrow">ПРОФИЛЬ</div><h2 style="margin:8px 0">RAMZES</h2><div class="muted">Tattoo Artist · Новосибирск</div><div class="listitem"><span>Роль</span><b>Мастер · демо</b></div><div class="listitem"><span>Telegram</span><b>'+(tg?.initData?'Подключён':'Предпросмотр')+'</b></div><div class="listitem"><span>Telegram ID для привязки сервера</span><b>'+(tg?.initDataUnsafe?.user?.id||'Откройте в Telegram')+'</b></div><div class="listitem"><span>Хранение данных</span><b>Локально · сервер подключается</b></div></section><section class="panel"><b>Важно</b><p class="muted" style="font-size:13px;line-height:1.5">Интерфейс подключается к серверу. Для включения синхронизации нужно безопасно привязать Telegram ID мастера. Не вноси реальные персональные, медицинские или платёжные данные до завершения проверки доступа и хранения.</p></section>'}
function addBooking(){view.innerHTML=heading('КАЛЕНДАРЬ','Новая запись','Демонстрационное добавление')+'<section class="panel"><label>Имя клиента</label><input class="field" id="bn" placeholder="Например, Алексей"><label>Время</label><input class="field" id="bt" type="time" value="12:00"><label>Услуга / проект</label><input class="field" id="bw" placeholder="Эскиз, сеанс, консультация"><button class="primary" id="saveBooking">Сохранить запись</button> <button class="secondary" data-go="calendar">Назад</button></section>'}
function addClient(){view.innerHTML=heading('КЛИЕНТЫ','Новый клиент','Создание демонстрационной карточки')+'<section class="panel"><label>Имя</label><input class="field" id="cn" placeholder="Имя клиента"><label>Телефон (необязательно)</label><input class="field" id="cp" placeholder="+7…"><button class="primary" id="saveClient">Добавить клиента</button> <button class="secondary" data-go="clients">Назад</button></section>'}
function detail(type){const box=$('#toolDetail');if(type==='calc'){box.innerHTML='<section class="panel"><b>Калькулятор стоимости</b><p class="muted">Предварительная оценка проекта</p><label>Размер работы, см</label><input class="field" id="size" type="number" min="1" value="10"><label>Сложность</label><select class="field" id="complex"><option value="1">Простая</option><option value="1.5">Средняя</option><option value="2">Высокая</option></select><label>Базовая цена за см</label><input class="field" id="rate" type="number" value="1000"><button class="primary" id="calculate">Рассчитать</button><h2 id="calcResult"></h2></section>'}
if(type==='stock'){box.innerHTML='<section class="panel"><b>Остатки материалов</b>'+stock.map(s=>'<div class="listitem"><span>'+s.name+'</span><b style="color:'+(s.qty<=s.min?'var(--yellow)':'var(--green)')+'">'+s.qty+' '+s.unit+'</b></div>').join('')+'<p class="muted" style="font-size:11px">Демо-остатки. Автоматические уведомления появятся после подключения сервера.</p></section>'}
if(type==='forms'){box.innerHTML='<section class="panel"><b>Документы и анкеты</b><div class="listitem">Анкета клиента <span class="tag">В разработке</span></div><div class="listitem">Информированное согласие <span class="tag">В разработке</span></div><div class="listitem">Разрешение на фото <span class="tag">В разработке</span></div><div class="listitem">Форма законного представителя <span class="tag">В разработке</span></div><p class="muted" style="font-size:11px">Формы будут подготовлены с учётом требований к персональным данным и юридической проверки.</p></section>'}
if(type==='ai'){box.innerHTML='<section class="panel"><b>ИИ-помощник мастера</b><p class="muted">Здесь появится помощник по работе с клиентами, маркетингу, продвижению и организации тату-бизнеса.</p><input class="field" placeholder="Напиши вопрос…" disabled><button class="secondary" disabled>Отправить · скоро</button></section>'}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
document.body.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){page=go.dataset.go;render();return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='add'){addBooking()}if(a==='calc'||a==='stock'||a==='forms'||a==='ai'){detail(a)}if(a==='stock'||a==='calc'||a==='forms'||a==='ai'){page='tools';render();detail(a)}});
document.body.addEventListener('click',e=>{if(e.target.id==='addBooking')addBooking();if(e.target.id==='addClient')addClient();
if(e.target.id==='saveBooking'){const name=$('#bn').value.trim();if(!name){toast('Укажи имя клиента');return}bookings.push({id:Date.now(),time:$('#bt').value,name,work:$('#bw').value||'Сеанс',status:'Ожидает подтверждения'});save();page='calendar';render();toast('Запись добавлена в демо-календарь')}
if(e.target.id==='saveClient'){const name=$('#cn').value.trim();if(!name){toast('Укажи имя клиента');return}clients.push({name,phone:$('#cp').value||'Не указан',visits:0,last:'Новый клиент'});save();page='clients';render();toast('Клиент добавлен')}
if(e.target.id==='calculate'){const total=Math.max(0,+$('#size').value)*(+$('#rate').value)*(+$('#complex').value);$('#calcResult').textContent='Ориентир: '+Math.round(total).toLocaleString('ru-RU')+' ₽'}
});
document.body.addEventListener('input',e=>{if(e.target.id==='search'){$('#clientList').innerHTML=clientRows(clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(e.target.value.toLowerCase())))}})
render();
})();
</script></body></html>
