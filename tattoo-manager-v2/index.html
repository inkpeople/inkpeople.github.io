</style></head><body>
<div class="app">
<header class="top"><div class="brand">TATTOO MANAGER<small id="connectionLabel">ПАНЕЛЬ МАСТЕРА · ПОДКЛЮЧЕНИЕ</small></div><div class="avatar">R</div></header>
<main id="view"></main>
</div>
<nav class="nav" id="nav">
<button data-page="home" class="active"><span>⌂</span>Главная</button><button data-page="calendar"><span>▦</span>Календарь</button><button data-page="clients"><span>♙</span>Клиенты</button><button data-page="tools"><span>✦</span>Инструменты</button><button data-page="profile"><span>☷</span>Профиль</button>
</nav><div class="toast" id="toast"></div>
<script>
(()=>{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#090909');tg.setBackgroundColor('#090909')}catch(e){}}
const $=s=>document.querySelector(s), view=$('#view');let page='home';
const today=new Date();const localISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const fmt=today.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'});
let bookings=[];let serverConnected=false;const API='https://jgzzdsittnzomedvsspj.supabase.co/functions/v1/tattoo-manager-api';
let clients=JSON.parse(localStorage.getItem('tm_clients')||'null')||[{name:'Анна Смирнова',phone:'+7 913 ••• •• 21',visits:3,last:'12 октября'},{name:'Дмитрий Волков',phone:'+7 923 ••• •• 48',visits:5,last:'28 сентября'},{name:'Мария К.',phone:'Контакт не указан',visits:1,last:'Новая заявка'}];
let stock=JSON.parse(localStorage.getItem('tm_stock')||'null')||[{name:'Иглы / картриджи',qty:24,unit:'шт',min:10},{name:'Трансферная бумага',qty:8,unit:'листов',min:10},{name:'Защитная плёнка',qty:3,unit:'рулона',min:2},{name:'Самоклеящийся бинт',qty:12,unit:'шт',min:5}];
function save(){localStorage.setItem('tm_bookings',JSON.stringify(bookings));localStorage.setItem('tm_clients',JSON.stringify(clients))}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}
function statusRu(s){return ({pending:'Ожидает подтверждения',confirmed:'Подтверждена',declined:'Отклонена',cancelled:'Отменена',completed:'Завершена'})[s]||s||'Новая'}
async function api(path='',options={}){if(!tg?.initData)throw new Error('Откройте приложение через Telegram');const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','x-telegram-init-data':tg.initData,...(options.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка сервера');return data}
async function syncAppointments(){try{const data=await api();if(data.role!=='master')throw new Error('Аккаунт не распознан как мастер');bookings=(data.appointments||[]).map(a=>({id:a.id,time:String(a.requested_time||'').slice(0,5),name:a.client_name||'Клиент',work:[a.project_type,a.body_placement].filter(Boolean).join(' · ')||a.idea||'Заявка',status:statusRu(a.status),rawStatus:a.status,date:a.requested_date}));serverConnected=true;$('#connectionLabel').textContent='ПАНЕЛЬ МАСТЕРА · СЕРВЕР ПОДКЛЮЧЁН';render()}catch(e){serverConnected=false;$('#connectionLabel').textContent='ПАНЕЛЬ МАСТЕРА · НЕТ СВЯЗИ';toast('Синхронизация: '+e.message)}}
async function changeStatus(id,status){try{await api('',{method:'PATCH',body:JSON.stringify({id,status})});toast('Статус записи обновлён');await syncAppointments()}catch(e){toast('Не удалось изменить запись: '+e.message)}}
function heading(k,t,sub=''){return '<div class="eyebrow">'+k+'</div><div class="headrow"><div><h1>'+t+'</h1>'+(sub?'<div class="muted">'+sub+'</div>':'')+'</div></div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,calendar,clients:clientPage,tools,profile})[page]()}
function home(){const todayKey=localISO(new Date());const todayBookings=bookings.filter(a=>a.date===todayKey&&a.rawStatus!=='cancelled'&&a.rawStatus!=='declined');const upcoming=bookings.filter(a=>a.date>=todayKey&&a.rawStatus!=='cancelled'&&a.rawStatus!=='declined').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));view.innerHTML=heading('РАБОЧЕЕ ПРОСТРАНСТВО','Добрый день, мастер 👋',fmt)+
'<div class="stats"><div class="stat"><label>Записи сегодня</label><strong>'+todayBookings.length+'</strong><em>На этот день</em></div><div class="stat"><label>Клиенты</label><strong>'+clients.length+'</strong><em>В демо-базе</em></div><div class="stat"><label>Выручка месяца</label><strong>—</strong><em>Подключим учёт</em></div><div class="stat"><label>Задачи</label><strong>2</strong><em>Требуют внимания</em></div></div>'+
'<section class="panel"><div class="panelhead"><b>Ближайшие записи</b><button class="link" data-go="calendar">Весь календарь →</button></div>'+(upcoming.slice(0,6).map(a=>'<div class="appointment"><div class="time">'+a.time+'</div><div class="apptmain"><b>'+a.name+'</b><small>'+a.work+'</small><small style="display:block">'+(a.date||'')+'</small>'+(a.rawStatus==='pending'?'<div class="row" style="margin-top:8px"><button class="secondary" data-booking-status="'+a.id+'" data-status="confirmed">Подтвердить</button><button class="secondary" data-booking-status="'+a.id+'" data-status="declined">Отклонить</button></div>':a.rawStatus==='confirmed'?'<div class="row" style="margin-top:8px"><button class="secondary" data-booking-status="'+a.id+'" data-status="completed">Завершить</button><button class="secondary" data-booking-status="'+a.id+'" data-status="cancelled">Отменить</button></div>':'')+'</div><span class="tag '+(a.rawStatus==='confirmed'?'green':'yellow')+'">'+a.status+'</span></div>').join('')||'<div class="empty">Ближайших записей нет</div>')+'</section>'+
'<div class="headrow"><b>Быстрые действия</b></div><div class="quick"><button class="tile" data-action="add"><span>＋</span><b>Новая запись</b><small>Добавить клиента</small></button><button class="tile" data-go="clients"><span>♙</span><b>Клиенты</b><small>Открыть базу</small></button><button class="tile" data-go="tools"><span>🧮</span><b>Калькулятор</b><small>Расчёт стоимости</small></button><button class="tile" data-go="tools"><span>📦</span><b>Склад</b><small>Остатки расходников</small></button></div>'}
function calendar(){const sorted=bookings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));view.innerHTML=heading('РАСПИСАНИЕ','Календарь','Записи синхронизируются с сервером')+'<section class="panel"><div class="panelhead"><b>Записи · '+sorted.length+'</b><div class="row"><button class="secondary" id="refreshBookings">↻</button><button class="primary" id="addBooking">＋ Добавить</button></div></div>'+(sorted.length?sorted.map(a=>'<div class="appointment"><div class="time">'+a.time+'</div><div class="apptmain"><b>'+a.name+'</b><small>'+a.work+'</small><small style="display:block">'+(a.date||'')+'</small>'+(a.rawStatus==='pending'?'<div class="row" style="margin-top:8px"><button class="secondary" data-booking-status="'+a.id+'" data-status="confirmed">Подтвердить</button><button class="secondary" data-booking-status="'+a.id+'" data-status="declined">Отклонить</button></div>':a.rawStatus==='confirmed'?'<div class="row" style="margin-top:8px"><button class="secondary" data-booking-status="'+a.id+'" data-status="completed">Завершить</button><button class="secondary" data-booking-status="'+a.id+'" data-status="cancelled">Отменить</button></div>':'')+'</div><span class="tag '+(a.rawStatus==='confirmed'?'green':'yellow')+'">'+a.status+'</span></div>').join(''):'<div class="empty">Записей пока нет</div>')+'</section>'}
function clientPage(){view.innerHTML=heading('КЛИЕНТСКАЯ БАЗА','Клиенты','Карточки и история взаимодействия')+'<input class="field" id="search" placeholder="Поиск по имени или телефону"><section class="panel"><div class="panelhead"><b>Все клиенты · '+clients.length+'</b><button class="primary" id="addClient">＋ Добавить</button></div><div id="clientList">'+clientRows(clients)+'</div></section>'}
function clientRows(arr){return arr.length?arr.map(c=>'<div class="listitem"><div><b>'+c.name+'</b><div class="muted" style="font-size:12px">'+c.phone+'</div><div class="muted" style="font-size:11px">Сеансов: '+c.visits+' · Последний визит: '+c.last+'</div></div><span>›</span></div>').join(''):'<div class="empty">Клиенты не найдены</div>'}
function tools(){view.innerHTML=heading('ИНСТРУМЕНТЫ','Рабочие инструменты','Дополнительные модули мастера')+'<div class="quick"><button class="tile" data-action="calc"><span>🧮</span><b>Калькулятор цены</b><small>Оценка проекта</small></button><button class="tile" data-action="stock"><span>📦</span><b>Склад</b><small>Остатки материалов</small></button><button class="tile" data-action="forms"><span>📝</span><b>Анкеты</b><small>Согласия и документы</small></button><button class="tile" data-action="ai"><span>✦</span><b>ИИ-помощник</b><small>Помощь мастеру</small></button></div><div id="toolDetail"></div>'}
function profile(){view.innerHTML=heading('АККАУНТ','Профиль мастера','Настройки рабочего пространства')+'<section class="panel"><div class="eyebrow">ПРОФИЛЬ</div><h2 style="margin:8px 0">RAMZES</h2><div class="muted">Tattoo Artist · Новосибирск</div><div class="listitem"><span>Роль</span><b>'+(serverConnected?'Мастер · сервер':'Мастер · проверка сервера')+'</b></div><div class="listitem"><span>Telegram</span><b>'+(tg?.initData?'Подключён':'Предпросмотр')+'</b></div><div class="listitem"><span>Telegram ID</span><b>'+(tg?.initDataUnsafe?.user?.id||'Откройте через меню бота')+'</b></div><div class="listitem"><span>Синхронизация</span><b>'+(serverConnected?'Сервер подключён':'Не подтверждена')+'</b></div></section><section class="panel"><b>Статус подключения</b><p class="muted" style="font-size:13px;line-height:1.5">'+(serverConnected?'Telegram распознан как аккаунт мастера. Записи загружаются с сервера.':'Telegram открыт, но успешный ответ сервера ещё не подтверждён. Проверь подключение перед использованием реальных данных.')+'</p></section>'}
function addBooking(){view.innerHTML=heading('КАЛЕНДАРЬ','Новая запись','Запись сразу сохранится в базе')+'<section class="panel"><label>Имя клиента *</label><input class="field" id="bn" placeholder="Например, Алексей"><label>Контакт</label><input class="field" id="bc" placeholder="Телефон или Telegram"><label>Дата *</label><input class="field" id="bd" type="date" value="'+localISO(new Date())+'"><label>Время *</label><input class="field" id="bt" type="time" value="12:00"><label>Проект</label><input class="field" id="bw" placeholder="Например, реализм"><label>Место на теле</label><input class="field" id="bp" placeholder="Предплечье, плечо…"><label>Описание</label><textarea class="field" id="bi" rows="3" placeholder="Идея и детали"></textarea><button class="primary" id="saveBooking">Сохранить запись</button> <button class="secondary" data-go="calendar">Назад</button></section>'}
function addClient(){view.innerHTML=heading('КЛИЕНТЫ','Новый клиент','Создание демонстрационной карточки')+'<section class="panel"><label>Имя</label><input class="field" id="cn" placeholder="Имя клиента"><label>Телефон (необязательно)</label><input class="field" id="cp" placeholder="+7…"><button class="primary" id="saveClient">Добавить клиента</button> <button class="secondary" data-go="clients">Назад</button></section>'}
function detail(type){const box=$('#toolDetail');if(type==='calc'){box.innerHTML='<section class="panel"><b>Калькулятор стоимости</b><p class="muted">Предварительная оценка проекта</p><label>Размер работы, см</label><input class="field" id="size" type="number" min="1" value="10"><label>Сложность</label><select class="field" id="complex"><option value="1">Простая</option><option value="1.5">Средняя</option><option value="2">Высокая</option></select><label>Базовая цена за см</label><input class="field" id="rate" type="number" value="1000"><button class="primary" id="calculate">Рассчитать</button><h2 id="calcResult"></h2></section>'}
if(type==='stock'){box.innerHTML='<section class="panel"><div class="panelhead"><b>Остатки материалов</b><span class="tag">На устройстве</span></div>'+stock.map((s,i)=>'<div class="listitem"><div style="flex:1"><b>'+s.name+'</b><small style="display:block;color:var(--muted);margin-top:4px">Минимальный остаток: '+s.min+' '+s.unit+'</small><div class="row" style="margin-top:9px"><button class="secondary" data-stock-action="minus" data-stock-index="'+i+'">−</button><b style="min-width:72px;text-align:center;color:'+(s.qty<=s.min?'var(--yellow)':'var(--green)')+'">'+s.qty+' '+s.unit+'</b><button class="secondary" data-stock-action="plus" data-stock-index="'+i+'">＋</button></div></div><span class="tag '+(s.qty<=s.min?'yellow':'green')+'">'+(s.qty<=s.min?'Пополнить':'В норме')+'</span></div>').join('')+'<div class="muted" style="font-size:11px;margin-top:12px">Изменения сохраняются на этом устройстве. Синхронизацию между устройствами подключим отдельно.</div></section>'}
if(type==='forms'){box.innerHTML='<section class="panel"><b>Документы и анкеты</b><div class="listitem">Анкета клиента <span class="tag">В разработке</span></div><div class="listitem">Информированное согласие <span class="tag">В разработке</span></div><div class="listitem">Разрешение на фото <span class="tag">В разработке</span></div><div class="listitem">Форма законного представителя <span class="tag">В разработке</span></div><p class="muted" style="font-size:11px">Формы будут подготовлены с учётом требований к персональным данным и юридической проверки.</p></section>'}
if(type==='ai'){box.innerHTML='<section class="panel"><b>ИИ-помощник мастера</b><p class="muted">Здесь появится помощник по работе с клиентами, маркетингу, продвижению и организации тату-бизнеса.</p><input class="field" placeholder="Напиши вопрос…" disabled><button class="secondary" disabled>Отправить · скоро</button></section>'}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
document.body.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){page=go.dataset.go;render();return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='add'){addBooking()}if(a==='calc'||a==='stock'||a==='forms'||a==='ai'){detail(a)}if(a==='stock'||a==='calc'||a==='forms'||a==='ai'){page='tools';render();detail(a)}});
document.body.addEventListener('click',async e=>{const sb=e.target.closest('[data-booking-status]');if(sb){changeStatus(sb.dataset.bookingStatus,sb.dataset.status);return}if(e.target.id==='addBooking')addBooking();if(e.target.id==='addClient')addClient();
const stockBtn=e.target.closest('[data-stock-action]');if(stockBtn){const idx=+stockBtn.dataset.stockIndex;if(stock[idx]){stock[idx].qty=Math.max(0,stock[idx].qty+(stockBtn.dataset.stockAction==='plus'?1:-1));localStorage.setItem('tm_stock',JSON.stringify(stock));detail('stock')}return}if(e.target.id==='refreshBookings'){syncAppointments();return}if(e.target.id==='saveBooking'){const name=$('#bn').value.trim(),date=$('#bd').value,time=$('#bt').value;if(!name||!date||!time){toast('Заполни имя, дату и время');return}if(!serverConnected){toast('Нет связи с сервером — запись не сохранена');return}try{await api('',{method:'POST',body:JSON.stringify({action:'create_master_booking',client_name:name,client_contact:$('#bc').value,requested_date:date,requested_time:time,project_type:$('#bw').value,body_placement:$('#bp').value,idea:$('#bi').value})});toast('Запись сохранена в базе');await syncAppointments();page='calendar';render()}catch(err){toast('Не удалось сохранить: '+err.message)}}
if(e.target.id==='saveClient'){const name=$('#cn').value.trim();if(!name){toast('Укажи имя клиента');return}clients.push({name,phone:$('#cp').value||'Не указан',visits:0,last:'Новый клиент'});save();page='clients';render();toast('Клиент добавлен')}
if(e.target.id==='calculate'){const total=Math.max(0,+$('#size').value)*(+$('#rate').value)*(+$('#complex').value);$('#calcResult').textContent='Ориентир: '+Math.round(total).toLocaleString('ru-RU')+' ₽'}
});
document.body.addEventListener('input',e=>{if(e.target.id==='search'){$('#clientList').innerHTML=clientRows(clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(e.target.value.toLowerCase())))}})
render();if(tg?.initData)syncAppointments();
})();
</script></body></html>
