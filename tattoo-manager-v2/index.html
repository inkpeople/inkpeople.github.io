async function loadFinance(){
 const box=$('#financeDetail');if(!box)return;box.innerHTML='<section class="panel">Загрузка…</section>';
 try{
 const d=await api(),tx=d.financeTransactions||[],plans=d.financePlans||[],payments=d.financePayments||[];
 const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
 const today=localISO(new Date()),monthKey=today.slice(0,7),yearKey=today.slice(0,4);const incomeTx=tx.filter(x=>x.transaction_type==='income'),todayIncome=incomeTx.filter(x=>x.transaction_date===today).reduce((a,x)=>a+Number(x.amount),0),monthIncome=incomeTx.filter(x=>String(x.transaction_date).slice(0,7)===monthKey).reduce((a,x)=>a+Number(x.amount),0),yearIncome=incomeTx.filter(x=>String(x.transaction_date).slice(0,4)===yearKey).reduce((a,x)=>a+Number(x.amount),0),avgCheck=incomeTx.length?incomeTx.reduce((a,x)=>a+Number(x.amount),0)/incomeTx.length:0,paidDebt=payments.reduce((a,x)=>a+Number(x.amount_paid||0),0);
 const opts=clients.filter(c=>c.id&&!c.localOnly).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
 const planHtml=plans.length?plans.map(pl=>{const rows=payments.filter(x=>x.plan_id===pl.id),bal=rows.reduce((a,x)=>a+Number(x.amount_due)-Number(x.amount_paid),0);return '<div class="listitem" style="display:block"><b>'+esc(pl.title)+'</b><small>'+money(pl.total_amount)+' · долг '+money(bal)+'</small>'+rows.map(x=>'<div class="row"><span>№'+x.installment_number+' · '+x.due_date+' · '+money(x.amount_due)+'</span>'+(x.status!=='paid'?'<button class="secondary" data-fin-pay="'+x.id+'" data-fin-left="'+(Number(x.amount_due)-Number(x.amount_paid))+'">Принять оплату</button>':'<span class="tag green">Оплачен</span>')+'</div>').join('')+'</div>'}).join(''):'<div class="empty">Рассрочек пока нет</div>';
 const txHtml=tx.length?tx.map(x=>'<div class="listitem"><span>'+(x.transaction_type==='income'?'+':'−')+money(x.amount)+' · '+esc(x.description||x.category)+' · '+x.transaction_date+'</span></div>').join(''):'<div class="empty">Операций пока нет</div>';
 const chartMonths=Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-11+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const monthTx=tx.filter(x=>String(x.transaction_date).slice(0,7)===key);return {label:['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()],income:monthTx.filter(x=>x.transaction_type==='income').reduce((a,x)=>a+Number(x.amount||0),0),expense:monthTx.filter(x=>x.transaction_type==='expense').reduce((a,x)=>a+Number(x.amount||0),0)}});
 const chartMax=Math.max(1,...chartMonths.flatMap(x=>[x.income,x.expense]));
 const chartHtml='<section class="panel" style="margin-top:14px"><b>Финансы · последние 12 месяцев</b><div style="display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;font-size:12px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#35c98a;margin-right:5px"></i>Доход</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#ef6b72;margin-right:5px"></i>Расход</span></div><div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:170px">'+chartMonths.map(m=>'<div style="display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;min-width:0"><div style="font-size:9px;white-space:nowrap;margin-bottom:4px">'+(m.income?esc(money(m.income)):'')+'</div><div style="height:112px;width:100%;display:flex;align-items:end;justify-content:center;gap:3px"><div title="Доход: '+money(m.income)+'" style="width:42%;max-width:18px;height:'+Math.max(m.income?3:0,m.income/chartMax*100)+'%;background:#35c98a;border-radius:4px 4px 0 0"></div><div title="Расход: '+money(m.expense)+'" style="width:42%;max-width:18px;height:'+Math.max(m.expense?3:0,m.expense/chartMax*100)+'%;background:#ef6b72;border-radius:4px 4px 0 0"></div></div><small style="font-size:8px;line-height:1;margin-top:7px;white-space:nowrap;letter-spacing:-.35px">'+esc(m.label)+'</small></div>').join('')+'</div><div style="font-size:11px;color:var(--muted);margin-top:8px">Сравнение поступлений и расходов по месяцам.</div></section>';

 box.innerHTML=chartHtml+'<div class="stats finance-stats"><div class="stat"><label>За сегодня получено</label><strong>'+money(todayIncome)+'</strong></div><div class="stat"><label>За месяц</label><strong>'+money(monthIncome)+'</strong></div><div class="stat"><label>За год</label><strong>'+money(yearIncome)+'</strong></div><div class="stat"><label>Средний чек</label><strong>'+money(avgCheck)+'</strong></div><div class="stat"><label>Отдали долг</label><strong>'+money(paidDebt)+'</strong></div></div>';
 }catch(e){box.innerHTML='<section class="panel">Ошибка: '+esc(e.message)+'</section>'}
}

 if(e.target.id==='copyMasterInvite'){const input=$('#masterInviteLink');if(input&&input.value){input.focus();input.select();let copied=false;try{copied=!!(await navigator.clipboard?.writeText(input.value))}catch(_){}if(!copied){try{copied=document.execCommand('copy')}catch(_){}}toast(copied?'Ссылка скопирована':'Выдели ссылку и скопируй вручную')}return}if(e.target.id==='saveCalendarEvent'){const type=$('#eventType').value,name=$('#eventName').value.trim(),time=$('#eventTime').value,note=$('#eventNote').value.trim();if(!name){toast('Укажи название события');return}if(!serverConnected){toast('Нет связи с сервером — событие не сохранено');return}const button=e.target;button.disabled=true;try{await api('',{method:'POST',body:JSON.stringify({action:'create_calendar_event',event_type:type,event_date:selectedCalendarDate,event_time:time,name,note})});toast('Событие сохранено в календаре');await syncAppointments()}catch(err){toast('Не удалось сохранить событие: '+err.message)}finally{button.disabled=false}return}const delEvent=e.target.closest('[data-delete-event]');if(delEvent){const id=delEvent.dataset.deleteEvent;if(String(id).startsWith('local-')){calendarEvents=calendarEvents.filter(a=>a.id!==id);writeLocal('tm_calendar_events',calendarEvents);render();toast('Локальное событие удалено');return}try{await api('',{method:'POST',body:JSON.stringify({action:'delete_calendar_event',id})});toast('Событие удалено');await syncAppointments()}catch(err){toast('Не удалось удалить событие: '+err.message)}return}const sb=e.target.closest('[data-booking-status]');if(sb){changeStatus(sb.dataset.bookingStatus,sb.dataset.status);return}if(e.target.id==='addBooking')addBooking();if(e.target.id==='addClient')addClient();
 const clientRow=e.target.closest('[data-client-id]');if(clientRow&&clientRow.id!=='saveClientDetails'&&clientRow.dataset.clientId){const rowIndex=Number(clientRow.dataset.clientIndex);clientDetail(Number.isInteger(rowIndex)&&rowIndex>=0?'__index__'+rowIndex:clientRow.dataset.clientId);return}
 if(e.target.id==='createClientLink'){const clientId=e.target.dataset.clientId;if(!clientId){toast('Сначала сохраните карточку клиента на сервере');return}const button=e.target;button.disabled=true;button.textContent='Создаём ссылку…';try{const result=await api('',{method:'POST',body:JSON.stringify({action:'create_client_link',client_id:clientId})});const box=$('#clientLinkResult');if(box)box.innerHTML='<div style="margin-top:12px"><input class="field" id="clientLinkUrl" readonly value="'+esc(result.link)+'"><button class="secondary" id="copyClientLink" style="width:100%;margin-top:8px">Скопировать ссылку</button><div class="muted" style="font-size:11px;margin-top:7px">Ссылка одноразовая и действует 15 минут. Отправьте её только этому клиенту.</div></div>';button.textContent='Создать новую ссылку';button.disabled=false;toast('Ссылка готова')}catch(err){button.disabled=false;button.textContent='Создать ссылку привязки';toast('Не удалось создать ссылку: '+err.message)}return}
 if(e.target.id==='copyClientLink'){const input=$('#clientLinkUrl');if(input){input.focus();input.select();let copied=false;try{await navigator.clipboard?.writeText(input.value);copied=true}catch(_){}if(!copied){try{copied=document.execCommand('copy')}catch(_){}}toast(copied?'Ссылка скопирована':'Выдели ссылку и скопируй вручную')}return}
 if(e.target.id==='uploadClientGallery'){let clientId=e.target.dataset.clientId;const file=$('#clientGalleryFile')?.files?.[0],caption=$('#clientGalleryCaption')?.value.trim()||'';if(!file){toast('Выбери фотографию');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Поддерживаются JPG, PNG и WEBP');return}if(file.size>12*1024*1024){toast('Исходный файл больше 12 МБ');return}const button=e.target;button.disabled=true;button.textContent='Подготовка фото…';try{if(!clientId){const local=clients.find(x=>String(x.localKey||x.name)===String(button.dataset.clientKey));if(!local)throw new Error('Клиент не найден');const saved=await api('',{method:'POST',body:JSON.stringify({action:'save_client',full_name:local.name,phone:local.phone||'',description:local.description||''})});clientId=saved.client.id;await syncAppointments()}const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const compressed=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1800/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let quality=.82,out=canvas.toDataURL('image/jpeg',quality);while(out.length>5_500_000&&quality>.45){quality-=.08;out=canvas.toDataURL('image/jpeg',quality)}if(out.length>5_500_000)reject(new Error('Не удалось уменьшить файл'));else resolve(out)};img.onerror=reject;img.src=dataUrl});button.textContent='Загрузка…';await api('',{method:'POST',body:JSON.stringify({action:'upload_gallery_photo',client_id:clientId,mime_type:'image/jpeg',image_base64:compressed,caption})});await syncAppointments();clientDetail(clientId);toast('Фото добавлено в личную галерею клиента')}catch(err){button.disabled=false;button.textContent='Загрузить фото для клиента';toast('Не удалось загрузить: '+err.message)}return}if(e.target.id==='saveClientDetails'){const c=clients.find(x=>String(x.id||x.localKey||x.name)===String(e.target.dataset.clientId));if(c){try{const result=await api('',{method:'POST',body:JSON.stringify({action:'save_client',id:c.localOnly?null:c.id,full_name:$('#clientEditName').value.trim()||c.name,phone:$('#clientEditPhone').value.trim(),description:$('#clientEditDescription').value.trim()})});if(c.localOnly)clients=clients.filter(x=>String(x.localKey||x.name)!==String(c.localKey||c.name));await syncAppointments();clientDetail(result.client.id);toast('Карточка сохранена на сервере')}catch(err){toast('Не удалось сохранить: '+err.message)}}return}
const stockBtn=e.target.closest('[data-stock-action]');if(stockBtn){const idx=+stockBtn.dataset.stockIndex;if(stock[idx]){stock[idx].qty=Math.max(0,stock[idx].qty+(stockBtn.dataset.stockAction==='plus'?1:-1));writeLocal('tm_stock',stock);detail('stock')}return}if(e.target.id==='refreshBookings'){syncAppointments();return}if(e.target.id==='saveBooking'){pendingBookingClientId=null;const name=$('#bn').value.trim(),date=$('#bd').value,time=$('#bt').value,clientId=$('#bookingClient').value||null;if(!name||!date||!time){toast('Заполни имя, дату и время');return}if(!serverConnected){toast('Нет связи с сервером — запись не сохранена');return}try{await api('',{method:'POST',body:JSON.stringify({action:'create_master_booking',client_id:clientId,client_name:name,client_contact:$('#bc').value,requested_date:date,requested_time:time,project_type:$('#bw').value,body_placement:$('#bp').value,idea:$('#bi').value})});toast('Запись сохранена в базе');await syncAppointments();page='calendar';render()}catch(err){toast('Не удалось сохранить: '+err.message)}}
if(e.target.id==='saveClient'){const name=$('#cn').value.trim();if(!name){toast('Укажи имя клиента');return}if(!serverConnected){toast('Нет связи с сервером — клиент не сохранён');return}try{await api('',{method:'POST',body:JSON.stringify({action:'save_client',full_name:name,phone:$('#cp').value,description:$('#cd').value.trim()})});await syncAppointments();page='clients';render();toast('Клиент добавлен в базу')}catch(err){toast('Не удалось добавить клиента: '+err.message)}}
if(e.target.id==='calculate'){const total=Math.max(0,+$('#size').value)*(+$('#rate').value)*(+$('#complex').value);$('#calcResult').textContent='Ориентир: '+Math.round(total).toLocaleString('ru-RU')+' ₽'}
});
document.body.addEventListener('change',e=>{if(e.target.id==='bookingClient'){const c=clients.find(x=>String(x.id)===String(e.target.value));if(c){$('#bn').value=c.name||'';$('#bc').value=c.phone||''}}if(e.target.id==='clientPhotoFile'){const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Выбери изображение');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const preview=$('#clientPhotoPreview');if(preview)preview.innerHTML='<img src="'+canvas.toDataURL('image/jpeg',.78)+'" alt="" style="width:100%;height:100%;object-fit:cover">'};img.src=reader.result};reader.readAsDataURL(file)}});

try{render();if(tg&&tg.initData)syncAppointments()}catch(err){console.error('TATTOO MANAGER startup error',err);view.innerHTML='<section class="panel" style="margin-top:30px;padding:22px"><div class="eyebrow">ОШИБКА ЗАПУСКА</div><h1 style="font-size:22px;margin:12px 0">Не удалось открыть кабинет</h1><p class="muted">Обнови страницу. Если ошибка повторится, отправь мастеру этот экран.</p><button class="primary" onclick="location.reload()">Перезапустить приложение</button></section>'}
