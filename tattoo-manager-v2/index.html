async function api(path='',options={}){if(!(tg&&tg.initData))throw new Error('Откройте приложение через Telegram');const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','x-telegram-init-data':tg.initData,...(options.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.error==='SCHEDULE_CONFLICT'?'Нельзя сохранить: '+(data.conflicts||[]).join('; '):data.error||'Ошибка сервера');return data}
async function syncAppointments(){try{const data=await api();if(data.role!=='master')throw new Error('Аккаунт не распознан как мастер');masterStudio=data.studio||null;updateMasterHeaderIdentity();masterReferralLink=masterStudio?'https://t.me/TattooManagerAppBot?start=studio_'+masterStudio.slug:'';bookings=(data.appointments||[]).map(a=>({id:a.id,clientId:a.client_id||null,time:String(a.requested_time||'').slice(0,5),name:a.client_name||'Клиент',projectType:a.project_type||'',idea:a.idea||'',clientTelegramId:a.client_telegram_user_id||null,clientConfirmationRequired:a.client_confirmation_required===true,rescheduleCount:Number(a.reschedule_count)||0,depositRebookingRequired:a.deposit_rebooking_required===true,proposedDate:a.proposed_date||null,proposedTime:String(a.proposed_time||'').slice(0,5),proposalNote:a.proposal_note||'',durationMinutes:Number(a.duration_minutes)||120,work:[a.project_type,a.body_placement].filter(Boolean).join(' · ')||a.idea||'Заявка',status:statusRu(a.status),rawStatus:a.status,date:a.requested_date}));const localCalendarEvents=calendarEvents.filter(x=>String(x.id||"").startsWith("local-"));calendarEvents=[...(data.calendarEvents||[]).map(e=>({id:e.id,date:e.event_date,time:String(e.event_time||"").slice(0,5),name:e.name,note:e.note||"",clientId:e.client_id||null,eventType:e.event_type,kind:"manual"})),...localCalendarEvents];const serverClients=(data.clients||[]).map(c=>({id:c.id,telegramId:c.telegram_user_id||null,name:c.full_name||'Клиент',phone:c.phone||'',photo:c.telegram_photo||'',description:c.description||'',telegram_link:c.telegram_link||'',vk_link:c.vk_link||'',threads_link:c.threads_link||'',instagram_link:c.instagram_link||'',website_link:c.website_link||'',other_links:Array.isArray(c.other_links)?c.other_links:[],gallery:c.gallery||[],visits:Number(c.visits)||0,last:c.last_visit||'Новый клиент'}));const serverIds=new Set(serverClients.map(c=>String(c.id)));const localOnly=clients.filter(c=>!c.id||!(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(c.id)))&&!serverIds.has(String(c.id))).map((c,i)=>({...c,localOnly:true,localKey:c.localKey||'local-'+String(c.id||i)}));clients=[...serverClients,...localOnly];stock=(data.inventoryItems||[]).map(x=>({id:x.id,name:x.name,qty:Number(x.quantity)||0,unit:x.unit,min:Number(x.min_quantity)||0,category:x.category||'Расходники'}));inventoryMovements=data.inventoryMovements||[];tasks=data.tasks||[];projects=(data.projects||[]).map(p=>({...p,price:p.price==null?'':Number(p.price),images:Array.isArray(p.images)?p.images:[]}));save();serverConnected=true;$('#connectionLabel').textContent='ПАНЕЛЬ МАСТЕРА · СЕРВЕР ПОДКЛЮЧЁН';render()}catch(e){serverConnected=false;$('#connectionLabel').textContent='ПАНЕЛЬ МАСТЕРА · НЕТ СВЯЗИ';toast('Синхронизация: '+e.message)}}
async function changeStatus(id,status){const booking=bookings.find(a=>String(a.id)===String(id));if(status==='confirmed'&&booking?.clientConfirmationRequired){toast('Ожидаем подтверждение клиента. Подтвердить запись может только клиент.');return}try{await api('',{method:'PATCH',body:JSON.stringify({id,status})});toast('Статус записи обновлён');await syncAppointments()}catch(e){toast('Не удалось изменить запись: '+e.message)}}
function heading(k,t,sub=''){return '<div class="eyebrow">'+k+'</div><div class="headrow"><div><h1>'+t+'</h1>'+(sub?'<div class="muted">'+sub+'</div>':'')+'</div></div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const pages={home,calendar,projects:projectsPage,clients:clientPage,tools,finance,profile,masters:mastersPage,instructions};try{if(typeof pages[page]!=='function')throw new Error('Раздел не найден: '+page);pages[page]()}catch(err){console.error('TATTOO MANAGER PAGE ERROR ['+page+']',err);const message=String(err&&err.message||err||'Неизвестная ошибка');view.innerHTML=heading('ОШИБКА РАЗДЕЛА','Не удалось открыть календарь','Диагностика ошибки')+'<section class="panel"><div class="notice" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(message)+'</div><button class="secondary" style="width:100%;margin-top:12px" data-go="home">Вернуться на главную</button></section>';}}
function home(){const todayKey=localISO(new Date());const todayBookings=bookings.filter(a=>a.date===todayKey&&a.rawStatus!=='cancelled'&&a.rawStatus!=='declined');const upcoming=bookings.filter(a=>a.date>=todayKey&&a.rawStatus!=='cancelled'&&a.rawStatus!=='declined').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));view.innerHTML=heading('РАБОЧЕЕ ПРОСТРАНСТВО','Добрый день, мастер',fmt)+
'<div class="stats"><div class="stat"><label>Записи сегодня</label><strong>'+todayBookings.length+'</strong><em>На этот день</em></div><div class="stat"><label>Клиенты</label><strong>'+clients.length+'</strong><em>В базе мастера</em></div><div class="stat"><label>Выручка месяца</label><strong id="homeMonthIncome">—</strong><em>Получено в текущем месяце</em></div><div class="stat"><label>Ожидают ответа</label><strong>'+bookings.filter(a=>a.rawStatus==='pending').length+'</strong><em>Новые заявки клиентов</em></div></div>'+
'<section class="panel"><div class="panelhead"><b>Ближайшие записи</b><button class="link" data-go="calendar">Весь календарь →</button></div>'+(upcoming.slice(0,6).map(a=>'<div class="appointment"><div class="time">'+a.time+'</div><div class="apptmain"><div class="client-heading"><b>'+a.name+'</b>'+(a.clientConfirmationRequired?'<span class="client-confirmation">Ждём подтверждения</span>':'<span class="tag '+(a.rawStatus==='confirmed'?'green':'yellow')+'">'+a.status+'</span>')+'</div>'+(a.clientConfirmationRequired?'<div class="booking-meta"><span class="tag yellow">Заявка</span><small class="booking-date">'+(a.date||'')+'</small></div>':'<small class="booking-date">'+(a.date||'')+'</small>')+(!a.clientConfirmationRequired&&a.work&&String(a.work).trim()!=='Заявка'?'<small class="booking-work">'+a.work+'</small>':'')+(a.rawStatus==='pending'?(a.clientConfirmationRequired?'<div class="booking-pending-actions"><button class="secondary" data-booking-propose="'+a.id+'">Предложить другое время</button><button class="secondary" data-booking-status="'+a.id+'" data-status="declined">Отклонить</button></div>':'<div class="row" style="margin-top:8px"><button class="secondary" data-booking-status="'+a.id+'" data-status="confirmed">Подтвердить</button><button class="secondary" data-booking-propose="'+a.id+'">Предложить другое время</button><button class="secondary" data-booking-status="'+a.id+'" data-status="declined">Отклонить</button></div>'):a.rawStatus==='reschedule_pending'?'<div class="notice" style="margin-top:8px">Предложено: '+a.proposedDate+' · '+a.proposedTime+'<br>Ожидаем ответ клиента.</div>':a.rawStatus==='confirmed'?'<div class="appointment-actions" style="display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px;width:100%;margin-top:8px"><button class="secondary" data-booking-status="'+a.id+'" data-status="completed">Завершить</button><button class="secondary" data-booking-status="'+a.id+'" data-status="cancelled">Отменить</button></div>':'')+(a.depositRebookingRequired?'<div class="notice" style="margin-top:8px"><b>Клиент запросил повторную бронь</b><br>После получения перевода подтвердите его кнопкой ниже.<button class="primary" style="width:100%;margin-top:8px" data-confirm-deposit="'+a.id+'">Бронь получена</button></div>':'')+'</div></div>').join('')||'<div class="empty">Ближайших записей нет</div>')+'</section>'+
'<div class="headrow"><b>Быстрые действия</b></div><div class="quick"><button class="tile" data-action="add"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><b>Новая запись</b><small>Добавить клиента</small></button><button class="tile" data-go="clients"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5.5a3.5 3.5 0 0 1 0 6.8M18 14a5 5 0 0 1 3.5 4.8"/></svg></span><b>Клиенты</b><small>Открыть базу</small></button><button class="tile" data-go="tools"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2m4 0h2M8 16h2m4 0h2"/></svg></span><b>Калькулятор</b><small>Расчёт стоимости</small></button><button class="tile" data-go="tools"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg></span><b>Склад</b><small>Остатки расходников</small></button><button class="tile" data-go="instructions"><span class="icon" aria-hidden="true">ⓘ</span><b>Инструкция</b><small>Как пользоваться приложением</small></button></div>';if(typeof loadHomeStats==='function')loadHomeStats()}
function instructions(){
 const sections = [
 ['КАК УСТРОЕН КАБИНЕТ МАСТЕРА','TATTOO MANAGER AI — рабочая панель мастера. Здесь собраны расписание, заявки, клиентская база, проекты, рабочие инструменты, финансы и настройки взаимодействия с клиентами. Данные разделов связаны: клиентская заявка попадает в календарь, клиент отображается в базе, проект можно связать с клиентом, а задачи — назначить на клиента. Начинайте работу с главной страницы, а для полного списка разделов используйте нижнюю навигацию и пункт «Ещё». Доступные пункты зависят от подключения кабинета к Telegram и серверу.'],
 ['1. ГЛАВНАЯ — СВОДКА РАБОЧЕГО ДНЯ','Карточка «Записи сегодня» показывает количество незавершённых и неотменённых записей на текущую дату. «Клиенты» показывает число карточек в базе мастера. «Выручка месяца» — сумму поступлений за текущий месяц, рассчитанную по финансовым операциям. «Ожидают ответа» — заявки со статусом ожидания. Ниже находятся ближайшие записи: время, имя клиента, вид работы, продолжительность и статус. Нажмите «Весь календарь», чтобы перейти к расписанию. В блоке быстрых действий можно начать новую запись, открыть клиентов, калькулятор, склад или руководство. Эти карточки являются сводкой: редактирование самой записи выполняется в календаре.'],
 ['2. КАЛЕНДАРЬ — КАК ЧИТАТЬ РАСПИСАНИЕ','Календарь показывает месяц и маркеры событий на датах. Стрелки слева и справа переключают месяцы, кнопка «Сегодня» возвращает к текущему дню. Нажмите дату — под календарём загрузится план именно этого дня. Цвета обозначают типы: красный — сеанс, фиолетовый — коррекция, голубой — консультация, оранжевый — ученик, серый — выходной, жёлтый — генеральная уборка, зелёный — модель. Легенда под календарём помогает расшифровать метки. Ниже расположена временная шкала с 08:00 до 23:00: блоки показывают начало, окончание и длительность. Если блоки пересекаются, приложение выводит предупреждение — проверьте время и продолжительность. Список «События на…» показывает все события выбранной даты; кнопка обновления повторно загружает записи.'],
 ['3. ДОБАВИТЬ СОБЫТИЕ — ВСЕ ПОЛЯ ФОРМЫ','В календаре нажмите «Добавить событие». Сначала выберите тип: сеанс, коррекция, консультация, ученик, модель, выходной или генеральная уборка. В поле «Клиент» можно выбрать существующую карточку; пункт «Новый клиент / без привязки» позволяет создать событие без связи с базой. Введите имя клиента или название события. Телефон и ссылки на Telegram, VK, Threads и Instagram помогают быстро связаться с человеком. Укажите дату и время. Для встреч выберите продолжительность от 1 до 8 часов. В поле «Проект / тип работы» впишите направление или название работы, в «Место на теле» — зону нанесения, в примечании — идею и важные детали. Для выходного и уборки поля клиента, длительности и описания проекта скрываются: достаточно названия и даты; время можно оставить пустым, если событие занимает весь день. Нажмите «Сохранить». Перед созданием проверьте дату, время и возможное пересечение с другими событиями.'],
 ['4. КАРТОЧКА СОБЫТИЯ — УПРАВЛЕНИЕ ЗАПИСЬЮ','В карточке события видны время, имя, описание работы, тип, статус, длительность и расчётное время окончания. У события, созданного вручную (например, выходного или уборки), есть кнопка «×» для удаления этого события из календаря. У клиентской записи есть кнопка «Изменить длительность»: используйте её, если фактическое планируемое время изменилось, чтобы календарь точнее показывал занятость. Для заявки со статусом ожидания доступны действия по её состоянию.'],
 ['5. ЗАЯВКИ И СТАТУСЫ — ЧТО НАЖИМАТЬ','Если заявка ожидает решения мастера, нажмите «Подтвердить», чтобы принять предложенные клиентом дату и время, или «Отклонить», если принять её нельзя. Если на карточке написано «Ожидаем подтверждение клиента», значит мастер уже предложил/отправил вариант, и теперь ответ должен дать клиент. В таком состоянии мастер не может подтвердить согласие за клиента; можно отклонить заявку. Для подтверждённой записи доступны «Завершить» и «Отменить». «Завершить» отмечает визит как состоявшийся и запускает связанные последующие процессы, например сообщение с рекомендациями по уходу и последующие напоминания, если они настроены. «Отменить» меняет статус записи на отменённый. После любого действия проверьте, что статус обновился.'],
 ['6. ПРЕДЛОЖИТЬ ДРУГОЕ ВРЕМЯ','Если предложенное клиентом время не подходит, откройте карточку заявки и используйте действие предложения другого времени. Укажите новую дату и время, при необходимости добавьте пояснение и отправьте предложение. Клиент увидит его в своём кабинете и сможет принять или отклонить. Пока клиент не ответил, в карточке отображается ожидание его подтверждения. Не создавайте параллельно вторую запись на тот же визит — сначала дождитесь ответа по текущей заявке.'],
 ['7. КЛИЕНТЫ — ПОИСК И СПИСОК','Откройте раздел «Клиенты». В строке поиска вводите имя или номер телефона — список отфильтруется по совпадениям. Кнопка «Добавить» открывает форму новой карточки. Нажмите на строку клиента, чтобы открыть его подробную карточку. Если список пуст, добавьте клиента вручную или дождитесь, когда клиент отправит заявку и появится в базе.'],
 ['8. ИМПОРТ ИЗ GOOGLE, ЯНДЕКС И APPLE КАЛЕНДАРЯ','Откройте раздел «Клиенты» и найдите блок «Импорт клиентов из календаря». Сначала экспортируйте нужный календарь в файл .ics. Google Календарь: на компьютере откройте календарь → наведите курсор на нужный календарь слева → ⋮ → «Настройки и общий доступ» → «Экспортировать календарь». Если нужно выгрузить все календари, откройте «Настройки» → «Импорт и экспорт» → «Экспорт»; ZIP-архив распакуйте и выберите нужный .ics. Яндекс Календарь: наведите курсор на название календаря слева → «Открыть настройки» → вкладка «Экспорт» → выберите iCal; откройте ссылку iCal в новой вкладке — файл .ics сохранится. Apple Календарь на Mac: выберите календарь в списке слева → Файл → Экспортировать → Экспортировать → сохраните .ics. Если календарь находится в iCloud, откройте его в приложении «Календарь» на Mac и экспортируйте таким же способом. Вернитесь в кабинет мастера, выберите файл .ics и нажмите «Прочитать файл и показать клиентов». Приложение извлечёт имя из названия события, телефон и ссылки из поля ссылки или описания, а остальной текст сохранит в заметках. Проверьте совпадения и нажмите «Импортировать». Совпадения по телефону или имени обновят существующую карточку, остальные добавятся как новые; повторные события одного клиента объединяются. Импорт переносит сведения о клиенте, но не сами события календаря и не может восстановить данные, которых нет в файле. Перед импортом проверьте список и сохраните исходный файл как резервную копию. Не импортируйте чужой календарь без разрешения.'],
 ['9. НОВАЯ КАРТОЧКА КЛИЕНТА','В форме создания заполните имя — это основное обязательное обозначение клиента. Телефон можно не указывать, если связь ведётся через Telegram. В поле «Описание / заметки» сохраняйте полезный контекст: идею, пожелания, предпочтения, договорённости и другие рабочие заметки. Нажмите «Добавить клиента». После сохранения карточка появится в общем списке, и её можно будет выбирать при создании записи, проекта или задачи.'],
 ['10. КАРТОЧКА КЛИЕНТА — ИСТОРИЯ И МАТЕРИАЛЫ','В карточке клиента можно изменить имя, телефон и описание/заметки, затем сохранить изменения. Ниже находится история связанных записей — она помогает посмотреть прошлые и предстоящие визиты. Галерея показывает фотографии завершённых работ, добавленные в карточку; нажмите на изображение, чтобы открыть его. Отдельно отображаются референсы, которые прислал клиент, и комментарии к ним. Референсы — это примеры и пожелания клиента, а не готовый эскиз. Используйте их как материал для обсуждения идеи.'],
 ['11. УДАЛЕНИЕ КЛИЕНТА — ВАЖНО','Кнопка «Удалить клиента» удаляет саму карточку клиента и связанные с ней фотографии галереи и референсы. Перед удалением приложение показывает подтверждение. Действие необратимо для удаляемых материалов. История записей и финансовые операции не удаляются автоматически: они могут остаться в системе без привязки к карточке клиента. Удаляйте карточку только если действительно хотите убрать её из базы.'],
 ['12. ПРОЕКТЫ — КАРТОТЕКА ТАТУ-РАБОТ','Раздел «Тату-проекты» предназначен для длительных или многоэтапных работ. В списке отображаются название, клиент, место на теле, стоимость, текущий статус и процент выполнения. Нажмите «Создать», чтобы завести новый проект, или выберите существующий проект для редактирования. Статусы отражают этап: «Новый», «Эскиз», «Согласован», «В работе», «Завершён», «Отменён». Выбирайте статус, соответствующий реальному состоянию работы, чтобы список проектов был полезен.'],
 ['13. СОЗДАНИЕ И РЕДАКТИРОВАНИЕ ПРОЕКТА','Название проекта обязательно — например, «Рукав в японском стиле». Клиента можно выбрать из базы или оставить «Без привязки». Укажите место на теле и согласованную стоимость в рублях. В описании зафиксируйте сюжет, стиль, композицию, пожелания и детали эскиза. В поле числа сеансов укажите планируемое количество от 1 до 50. Прикрепляйте эскизы и фотографии в форматах JPG, PNG или WEBP, до 8 МБ на файл; изображения хранятся в закрытом хранилище проекта. Выберите статус и нажмите «Сохранить проект». В уже созданном проекте можно обновить сведения или удалить проект отдельной кнопкой; удаление используйте осознанно.'],
 ['14. ЭТАПЫ И ПРОГРЕСС ПРОЕКТА','В карточке проекта первый этап — создание эскиза; далее учитываются сеансы. После сохранения проекта приложение создаёт список запланированных сеансов. Нажмите строку конкретного сеанса, чтобы переключить его между «Не выполнен» и «Выполнен». Процент готовности пересчитывается по отметкам о выполненных сеансах. Если количество запланированных сеансов изменилось, откройте проект, поменяйте число и сохраните его. Не отмечайте сеанс выполненным заранее: прогресс нужен для реального контроля работы.'],
 ['15. КАЛЬКУЛЯТОР ЦЕНЫ','Откройте «Ещё» → «Инструменты» → «Калькулятор цены». Введите размер работы в сантиметрах, выберите сложность и задайте базовую цену за сантиметр. Коэффициенты сложности: простая — 1, средняя — 1,5, высокая — 2. Нажмите «Рассчитать». Расчёт выполняется по формуле: размер × базовая цена за сантиметр × коэффициент сложности. Результат — предварительный ориентир, а не автоматическая цена для клиента. Учитывайте композицию, место нанесения, детализацию, время и индивидуальные условия при окончательном согласовании.'],
 ['16. СКЛАД — ДОБАВЛЕНИЕ МАТЕРИАЛОВ','Откройте «Ещё» → «Инструменты» → «Склад». Вверху показано количество позиций и число материалов, которые пора пополнить. При добавлении выберите категорию: иглы/картриджи, расходники, краски или прочее. Для картриджей можно указать фирму отдельно, а в названии — конфигурацию, например 5 RM 0.30 или 7 RL 0.35. Введите название, количество, единицу измерения (например, шт.) и минимальный остаток. Нажмите «Добавить на склад». Минимальный остаток — порог, при достижении которого позиция помечается как заканчивающаяся.'],
 ['17. СКЛАД — ПРИХОД, СПИСАНИЕ И ИСТОРИЯ','В списке материалов отображается текущий остаток и минимальный уровень. Метка «Заканчивается» появляется, когда остаток равен минимуму или ниже; «В норме» — когда запас выше порога. «＋ Приход» увеличивает количество после поступления новой партии. «− Списать» уменьшает остаток при использовании или выбытии материала. Вводите фактическое количество операции и причину, если приложение предлагает это поле. «Убрать» удаляет позицию из списка — не используйте его вместо обычного списания, если важно сохранить учёт движения. Блок «Последние движения» показывает недавние поступления и списания, дату, количество и причину.'],
 ['18. ЗАДАЧИ И НАПОМИНАНИЯ — СОЗДАНИЕ','В «Ещё» → «Инструменты» → «Задачи» создавайте рабочие напоминания: подготовить эскиз, заказать расходники, написать клиенту и т. п. Поле «Название» обязательно. В описании уточните, что именно нужно сделать. Укажите дату, при необходимости время, приоритет (высокий, средний или низкий) и клиента из базы. Если указаны дата и время, Telegram-бот должен отправить напоминание к назначенному сроку. Если время не задано, автоматическое уведомление не отправляется.'],
 ['19. ЗАДАЧИ — СТАТУСЫ И УДАЛЕНИЕ','Активные задачи показываются отдельно от выполненных. Цветная полоска и подпись показывают приоритет, а карточка — срок, время, описание и привязанного клиента. Нажмите «Выполнено», когда задача сделана: она перейдёт в список выполненных. Если задача снова актуальна, нажмите «Вернуть». «Удалить» удаляет задачу; перед удалением проверьте, что она больше не нужна. Количество активных задач отображается в заголовке раздела.'],
 ['20. ФИНАНСЫ — ГРАФИК И ПОКАЗАТЕЛИ','В разделе «Финансы» отображается диаграмма за последние 12 месяцев: зелёные столбцы — поступления, красные — расходы. Высота столбцов сопоставляет суммы между месяцами; наведите курсор или откройте подсказку столбца, чтобы увидеть сумму. Ниже показаны поступления за сегодня, за текущий месяц и за год, средний чек по зарегистрированным поступлениям и сумма погашенных долгов по платежам рассрочки. Показатели строятся по данным, уже записанным в финансовой базе; если операция не внесена в систему, она не попадёт в расчёт. Это аналитическая сводка, а не банковская выписка.'],
 ['21. ФИНАНСЫ — ПЛАТЕЖИ ПО РАССРОЧКЕ','Если в системе есть план рассрочки, он отображается с общей суммой и остатком долга. Внутри плана видны платежи: номер, срок и сумма к оплате. Для неоплаченного платежа нажмите «Принять оплату» и укажите полученную сумму в появившемся действии. Полностью оплаченный платёж получает отметку «Оплачен». Сумма погашенных долгов учитывается в финансовой сводке. Перед подтверждением сверяйте поступившую сумму с фактическим переводом клиента.'],
 ['22. ПРОФИЛЬ — ПОДКЛЮЧЕНИЕ И ПЕРСОНАЛЬНАЯ ССЫЛКА','В «Ещё» → «Профиль» отображаются имя мастера, город, роль, состояние подключения Telegram и сервера. Если написано, что соединение не подтверждено, проверьте, что открыли приложение через Telegram и есть интернет. Блок «Персональная ссылка для клиентов» содержит ссылку на ваш кабинет. Нажмите «Скопировать ссылку» и отправьте её клиенту: переход по ней помогает автоматически связать клиента с вашим кабинетом. Не отправляйте ссылку посторонним, если не хотите, чтобы они выбирали именно ваш профиль.'],
 ['23. ПРОФИЛЬ — ОТЗЫВЫ','Вставьте в поле ссылку на вашу страницу отзывов — например, на Яндекс Картах, 2ГИС, VK или другой площадке, — и нажмите «Сохранить ссылку для отзывов». После завершённого сеанса система может отправить клиенту эту ссылку через 14 дней. Если поле оставить пустым, автоматическая ссылка на внешнюю площадку не отправляется; клиент сможет написать отзыв мастеру через бота. Проверяйте, что ссылка открывается и ведёт на нужную страницу.'],
 ['24. ПРОФИЛЬ — БРОНЬ И ПЕРЕНОСЫ','В блоке «Бронь и переносы» задаются условия повторной брони после исчерпания клиентом трёх переносов: сумма в рублях, способ перевода, имя получателя и реквизиты/инструкция. Заполните все нужные поля и нажмите «Сохранить настройки брони». Клиент увидит эти данные в своём кабинете и получит их в Telegram, когда запросит повторную бронь. После фактического поступления денег откройте соответствующую запись и вручную нажмите «Бронь получена». Не подтверждайте получение, пока не проверили перевод.'],
 ['25. ИИ-ПОМОЩНИК МАСТЕРА','Откройте «Ещё» → «Инструменты» → «ИИ-помощник». Готовые кнопки запускают запросы: «Анализ клиентов», «План на сегодня», «Отчёт по финансам» и «Идеи для Threads». Можно написать собственный вопрос в поле и отправить стрелкой или клавишей Enter. Помощник может анализировать данные клиентов, календаря, проектов, финансов, склада и задач, а также подготовить идеи и рекомендации. Сейчас он работает в режиме чтения: не создаёт и не редактирует клиентов, записи, проекты, задачи и операции. Для ответа данные кабинета передаются сервису ИИ; не отправляйте в свободном вопросе пароли и лишние конфиденциальные сведения.'],
 ['26. АНКЕТЫ И ДОКУМЕНТЫ — ПОКА НЕ РАБОТАЮТ','В «Инструментах» есть раздел «Анкеты»: анкета клиента, информированное согласие, разрешение на фото и форма законного представителя. Все пункты помечены «В разработке». Сейчас это перечень будущих модулей, а не действующие формы для заполнения, подписания или хранения документов. Не используйте их как подтверждение юридического согласия клиента.'],
 ['27. СИНХРОНИЗАЦИЯ И БЕЗОПАСНАЯ РАБОТА','Кабинет получает данные через сервер. Если приложение показывает отсутствие соединения, сначала проверьте интернет и откройте Mini App именно из Telegram. После ошибки не нажимайте сохранение многократно: сначала обновите раздел и проверьте, не появилось ли уже созданное событие, операция или задача. При спорном результате сохраните текст ошибки и обратитесь за проверкой. Не передавайте другим людям Telegram-код входа, ссылки с личным доступом или реквизиты клиентов.']
 ];
 view.innerHTML=heading('ПОЛНОЕ РУКОВОДСТВО','Как пользоваться кабинетом мастера','Подробно о каждом разделе, действии и результате')+
 '<section class="panel"><h3>С чего начать</h3><p class="muted">Это руководство относится только к кабинету мастера. Оно описывает доступные сейчас функции приложения. Если пункт помечен как находящийся в разработке, он пока не выполняет заявленную рабочую функцию. Вы можете открыть нужную тему по порядку и сверяться с ней во время работы.</p></section>'+
 sections.map(s=>'<section class="panel"><h3>'+s[0]+'</h3><p class="muted" style="line-height:1.65">'+s[1]+'</p></section>').join('')+
 '<div class="notice">Если фактическое поведение кнопки отличается от описания, не повторяйте действие много раз. Зафиксируйте название раздела и сообщение на экране, чтобы можно было проверить именно этот сценарий.</div><button class="primary" data-go="home">Вернуться на главную</button>';
}
function calendar(){
 const minutesClock=value=>{const total=Math.max(0,Math.round(Number(value)||0));return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')};
 const types=[['session','Сеанс','#df2632'],['correction','Коррекция','#a78bfa'],['consult','Консультация','#55a6e8'],['student','Ученик','#e58b58'],['dayoff','Выходной','#929999'],['cleaning','Генеральная уборка','#e5c45b'],['model','Модель','#72c995']];
 const normalizeType=k=>{const v=String(k||'').toLowerCase();const aliases={appointment:'session',tattoo:'session',session:'session',fix:'correction',consultation:'consult',student_session:'student',day_off:'dayoff',clean:'cleaning',model_session:'model'};const key=aliases[v]||v;return types.some(t=>t[0]===key)?key:'session'};
 const typeInfo=k=>types.find(t=>t[0]===normalizeType(k))||types[0];
 const inferType=a=>{const v=((a.projectType||a.project_type||'')+' '+(a.work||'')+' '+(a.idea||'')).toLowerCase();if(v.includes('коррек'))return 'correction';if(v.includes('консультац'))return 'consult';if(v.includes('ученик')||v.includes('обучен'))return 'student';if(v.includes('выходн'))return 'dayoff';if(v.includes('генеральн')||v.includes('уборк'))return 'cleaning';if(v.includes('модел'))return 'model';return 'session'};
 const allEvents=[...bookings.filter(a=>a.rawStatus!=='cancelled'&&a.rawStatus!=='declined').map(a=>({...a,kind:'booking',eventType:inferType(a)})),...calendarEvents.map(a=>({...a,kind:'manual',eventType:normalizeType(a.eventType||a.type||a.event_type)}))];
 const monthStart=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1),monthEnd=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,0);
 const monthLabel=calendarCursor.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),weekdays=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
 const offset=(monthStart.getDay()+6)%7,days=[];
 for(let i=0;i<offset;i++)days.push('<div class="cal-empty"></div>');
 for(let n=1;n<=monthEnd.getDate();n++){const key=localISO(new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),n)),dayEvents=allEvents.filter(a=>a.date===key),markers=[...new Set(dayEvents.map(a=>a.eventType))].map(k=>'<i style="--event-color:'+typeInfo(k)[2]+';background-color:'+typeInfo(k)[2]+' !important"></i>').join('');days.push('<button class="cal-day'+(key===selectedCalendarDate?' selected':'')+(key===localISO(new Date())?' today':'')+(dayEvents.length?' has-events':'')+'" data-cal-date="'+key+'"><span>'+n+'</span>'+(markers?'<span class="cal-markers">'+markers+'</span>':'<i class="cal-dot"></i>')+'</button>')}
 const selectedBookings=allEvents.filter(a=>a.date===selectedCalendarDate).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),selectedLabel=new Date(selectedCalendarDate+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});

 const timelineStart=480,timelineEnd=1380,timelineHeight=900;
 const timed=selectedBookings.filter(a=>a.eventType!=='dayoff'&&/^\d{2}:\d{2}$/.test(String(a.time||''))).map(a=>{const start=Number(a.time.slice(0,2))*60+Number(a.time.slice(3,5)),duration=a.kind==='booking'?(Number(a.durationMinutes)||120):60;return {...a,start,end:start+duration,duration}}).filter(a=>a.end>timelineStart&&a.start<timelineEnd).sort((a,b)=>a.start-b.start||b.end-a.end);
 const lanes=[];timed.forEach(a=>{let lane=0;while(lanes[lane]&&lanes[lane]>a.start)lane++;a.lane=lane;lanes[lane]=a.end});
 const laneCount=Math.max(1,lanes.length);
 const timedBlocks=timed.map(a=>{const info=typeInfo(a.eventType),top=Math.max(0,a.start-timelineStart),bottom=Math.min(timelineEnd,a.end)-timelineStart,height=Math.max(34,bottom-top),left=a.lane/laneCount*100,width=100/laneCount;return '<div class="timeline-event" style="top:'+top+'px;height:'+height+'px;left:calc('+left+'% + 3px);width:calc('+width+'% - 6px);--event-color:'+info[2]+'"><b>'+esc(a.name)+'</b><span>'+a.time+'–'+minutesClock(a.end)+' · '+(a.kind==='booking'?(a.duration/60)+' ч.':info[1])+'</span></div>'}).join('');
 const hourLines=Array.from({length:16},(_,i)=>'<div class="timeline-hour" style="top:'+(i*60)+'px"><span>'+String(8+i).padStart(2,'0')+':00</span></div>').join('');
 const allDay=selectedBookings.filter(a=>!a.time||a.eventType==='dayoff').map(a=>'<div class="timeline-allday" style="--event-color:'+typeInfo(a.eventType)[2]+'">'+esc(a.name)+' · '+typeInfo(a.eventType)[1]+'</div>').join('');

async function uploadMasterPortfolio(file){
 const status=$('#masterPortfolioStatus');if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('Выбери JPG, PNG или WebP');return;}
 if(file.size>12*1024*1024){toast('Исходное фото больше 12 МБ');return;}
 const input=$('#masterPortfolioFile');if(input)input.disabled=true;if(status)status.textContent='Подготавливаем фотографию…';
 try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('Не удалось прочитать фотографию'));reader.readAsDataURL(file)});
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Не удалось открыть фотографию'));img.src=dataUrl});
  const scale=Math.min(1,1800/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Не удалось обработать фотографию');ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const compressed=canvas.toDataURL('image/jpeg',0.82);
  if(status)status.textContent='Загружаем фотографию…';
  const d=await api('',{method:'POST',body:JSON.stringify({action:'add_master_portfolio_photo',image_base64:compressed})});
  renderMyPortfolio(d.portfolio||[]);if(status)status.textContent='Фотография добавлена. Осталось '+Math.max(0,12-(d.portfolio||[]).length)+' мест.';
  toast('Работа добавлена в портфолио');
 }catch(err){toast('Не удалось загрузить: '+err.message);if(status)status.textContent=err.message;}
 finally{if(input){input.disabled=false;input.value='';}}
}

async function loadMasterChat(){

async function findMastersFromContacts(){
 const status=$('#masterContactsStatus'),box=$('#masterSearchResults'),button=$('#findMastersFromContacts');
 if(!navigator.contacts||typeof navigator.contacts.select!=='function'){
  if(status)status.innerHTML='Встроенный просмотр телефонной книги не поддерживается этим браузером. Открой приложение в Chrome на Android и попробуй снова. Telegram не предоставляет Mini App доступ ко всему списку друзей.';
  return;
 }
 try{
  button.disabled=true;button.textContent='Открываем контакты…';
  const selected=await navigator.contacts.select(['name','tel'],{multiple:true});
  if(!selected||!selected.length){if(status)status.textContent='Контакты не выбраны.';return;}
  const contacts=[];
  for(const c of selected){
   const name=Array.isArray(c.name)?c.name.join(' ').trim():String(c.name||'').trim();
   const tels=Array.isArray(c.tel)?c.tel:[c.tel||''];
   for(const tel of tels){if(String(tel||'').trim())contacts.push({name:name.slice(0,120),tel:String(tel).slice(0,100)});}
  }
  if(!contacts.length){if(status)status.textContent='В выбранных контактах не нашлось телефонных номеров.';return;}
  if(status)status.textContent='Проверяем '+selected.length+' выбранных контактов…';
  box.innerHTML='<div class="empty">Ищем совпадения среди мастеров TATTOO MANAGER…</div>';
  const d=await api('',{method:'POST',body:JSON.stringify({action:'find_masters_by_contacts',contacts})});
  const rows=d.masters||[];
  box.innerHTML=rows.length?rows.map(x=>masterCard(x,'search')).join(''):'<div class="empty">Совпадений пока нет. Мастер должен быть зарегистрирован и указать этот номер в профиле.</div>';
  if(status)status.textContent='Проверено контактов: '+selected.length+'. Найдено мастеров: '+rows.length+'. Номера не сохраняются в телефонную книгу приложения.';
 }catch(err){
  if(err&&err.name==='AbortError'){if(status)status.textContent='Выбор контактов отменён.';}
  else{if(status)status.textContent='Не удалось проверить контакты: '+esc(err.message);}
 }finally{button.disabled=false;button.textContent='📱 Выбрать контакты телефона';}
}

let masterAIHistory=[];
function aiInlineFormat(parent,text){
 const source=String(text??'');
 const pattern=/\\?\*\*(.+?)\\?\*\*|\\?__(.+?)\\?__|\\?\x60([^\x60]+)\\?\x60/g;
 let last=0,match;
 while((match=pattern.exec(source))!==null){
  if(match.index>last)parent.appendChild(document.createTextNode(source.slice(last,match.index).replace(/\\([*_])/g,'$1')));
  if(match[1]!==undefined||match[2]!==undefined){
   const strong=document.createElement('strong');strong.textContent=(match[1]??match[2]).replace(/\\([*_])/g,'$1');parent.appendChild(strong);
  }else{
   const code=document.createElement('code');code.textContent=match[3];parent.appendChild(code);
  }
  last=pattern.lastIndex;
 }
 if(last<source.length)parent.appendChild(document.createTextNode(source.slice(last).replace(/\\([*_])/g,'$1')));
}
function aiTableCells(line){
 return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim());
}
function aiIsTableSeparator(line){
 const cells=aiTableCells(line);
 return cells.length>1&&cells.every(cell=>/^:?-{3,}:?$/.test(cell));
}

 const flushParagraph=()=>{
  if(!paragraph.length)return;

 };
 const closeList=()=>{if(list){parent.appendChild(list);list=null;}};
 const addTable=rows=>{
  const table=document.createElement('table');table.className='ai-table';
  const thead=document.createElement('thead'),tbody=document.createElement('tbody');
  rows[0].forEach(value=>{const th=document.createElement('th');aiInlineFormat(th,value);thead.appendChild(th);});
  rows.slice(1).forEach(row=>{
   const tr=document.createElement('tr');
   for(let i=0;i<rows[0].length;i++){const td=document.createElement('td');aiInlineFormat(td,row[i]??'');tr.appendChild(td);}
   tbody.appendChild(tr);
  });
  table.append(thead,tbody);parent.appendChild(table);
 };
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(!line){flushParagraph();closeList();continue;}
  if(line.includes('|')&&i+1<lines.length&&aiIsTableSeparator(lines[i+1].trim())){
   flushParagraph();closeList();
   const rows=[aiTableCells(line)];i+=2;
   while(i<lines.length&&lines[i].trim().includes('|')&&lines[i].trim()){rows.push(aiTableCells(lines[i]));i++;}
   i--;addTable(rows);continue;
  }
  if(/^([-*_]\s*){3,}$/.test(line)){flushParagraph();closeList();continue;}
  const heading=line.match(/^#{1,4}\s+(.+)$/);
  if(heading){flushParagraph();closeList();const h=document.createElement(heading[0].startsWith('# ')?'h3':'h4');aiInlineFormat(h,heading[1].replace(/\s*#+$/,''));parent.appendChild(h);continue;}
  const boldHeading=line.match(/^\\?\*\*(.+?)\\?\*\*$/);
  if(boldHeading&&line.length<100){flushParagraph();closeList();const h=document.createElement('h4');aiInlineFormat(h,boldHeading[1]);parent.appendChild(h);continue;}
  const bullet=line.match(/^[-*+]\s+(.+)$/);
  const numbered=line.match(/^\d+[.)]\s+(.+)$/);
  if(bullet||numbered){
   flushParagraph();const tag=numbered?'ol':'ul';
